  /businesses/lookup:
    get:
      operationId: lookupBusinesses
      tags: [businesses]
      summary: Find public business matches to claim or to avoid duplicate drafts
      description: |
        Bounded lookup over current public business listings and existing business profiles.
        Every match is allowlisted to public facts only (name, neighbourhood, category, public
        source URL, whether the listing is already claimed). No contact details, claimant data,
        pending-claim details, or private drafts are ever returned. Requires a signed-in account,
        is rate limited per account (429 RATE_LIMITED), and returns 503 when the listing source
        cannot be read rather than an empty list. Returns 404 while the business intake gate is off.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
          description: Business name (or part of it) to look up.
      responses:
        "200":
          description: Public matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessLookupResponse"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"
        "429":
          description: Too many lookups; wait before trying again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The listing source could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /businesses:
    post:
      operationId: createBusinessIntakeDraft
      tags: [businesses]
      summary: Create a private claim draft for an existing listing or a new business
      description: |
        Creates a private `draft` claim for the signed-in, verified representative. For
        `existing_listing` the listing is re-resolved server-side from the approved provider by
        city, source, and listing ID; browser-supplied names and addresses never redefine the
        business. For `new_business` a private draft profile (`publicationStatus = draft`) and the
        owner-candidate claim are created in one transaction; the draft is invisible on public
        routes and to other users. Drafts hold no claim slot until they are submitted.
        Send an `Idempotency-Key` header to make retries safe: a repeated key returns the original
        claim (200) instead of a duplicate; the same key with a different payload returns 409
        IDEMPOTENCY_CONFLICT. Creating a draft never grants ownership.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessIntakeDraftInput"
      responses:
        "201":
          description: Draft claim created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessClaim"
        "200":
          description: Idempotent replay of an earlier draft creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessClaim"
        "400":
          description: Invalid draft, unknown field, or the listing is not a current claimable listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Unverified, suspended, or deleted account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"
        "409":
          description: You already have an open draft or claim for this business, or the idempotency key was reused with a different payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The listing could not be verified right now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /business-claims/{id}:
    get:
      operationId: getBusinessClaim
      tags: [businesses]
      summary: Get one of the signed-in user's claims with its current status and next action
      description: Only the claim's creator can read it; any other claim answers 404 without disclosing whether it exists. Returns 404 while the business intake gate is off.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "200":
          description: The claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessClaim"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found, not yours, or the intake gate is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateBusinessClaim
      tags: [businesses]
      summary: Update a draft or changes-requested claim with optimistic concurrency
      description: |
        Updates contact, authority, and evidence fields (and the business facts of a new-business
        draft) while the claim is `draft` or `changes_requested`. `expectedVersion` must equal the
        current `version`; a mismatch returns 409 VERSION_CONFLICT with the current
        `expectedVersion`. Listing identity, status, claimant, and review fields cannot be set here
        (400 UNKNOWN_FIELD).
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessClaimUpdateInput"
      responses:
        "200":
          description: Updated claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessClaim"
        "400":
          description: Invalid input or unknown field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Unverified account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found, not yours, or the intake gate is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Stale version or the claim is not editable in its current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /business-claims/{id}/submit:
    post:
      operationId: submitBusinessClaim
      tags: [businesses]
      summary: Submit a draft (or resubmit a changes-requested claim) for manual review
      description: |
        Moves a `draft` or `changes_requested` claim to `submitted` and takes the single open-claim
        slot for the business. Duplicates are re-checked transactionally at this moment: another
        open claim for the same business returns 409. When the business already has a verified
        owner the claim is recorded as `disputed` for manual review instead of granting anything.
        `expectedVersion` must match. Submission never grants ownership; approval is a later,
        explicit reviewer action.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessClaimTransitionInput"
      responses:
        "200":
          description: Submitted claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessClaim"
        "400":
          description: Invalid input, unknown field, or the draft is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Unverified account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found, not yours, or the intake gate is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Stale version, wrong status, or another claim for this business is already under review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /business-claims/{id}/withdraw:
    post:
      operationId: withdrawBusinessClaim
      tags: [businesses]
      summary: Withdraw a draft or open claim
      description: |
        Moves a `draft`, `pending`, `submitted`, `changes_requested`, or `disputed` claim to
        `withdrawn`, keeps the audit trail, and frees the business for other claims. A withdrawn
        new-business draft profile is archived. `expectedVersion` must match. Approved or
        rejected claims cannot be withdrawn (409).
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessClaimTransitionInput"
      responses:
        "200":
          description: Withdrawn claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessClaim"
        "400":
          description: Invalid input or unknown field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found, not yours, or the intake gate is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Stale version or the claim can no longer be withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /business-profiles/mine:
    get:
      operationId: getMyBusinessProfiles
      tags: [businesses]
