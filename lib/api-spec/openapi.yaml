openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: capture
    description: Business event capture operations
  - name: listings
    description: Local business and event listings
  - name: source-scanning
    description: Den Haag activity source scanning
  - name: event-review
    description: Editorial review of source-scanned Den Haag event candidates
  - name: social-map-review
    description: Periodic source review of curated Den Haag support locations
  - name: news
    description: Den Haag news aggregation
  - name: weather
    description: City weather forecast
  - name: community
    description: Resident and organisation community posts
  - name: businesses
    description: Business claims, profiles, and local deals
  - name: business-publication
    description: Editorial review, immutable profile revisions, and controlled publication
  - name: saved-events
    description: Account-backed saved event snapshots and alerts
  - name: registration
    description: Authenticated community registration and participation eligibility
  - name: account
    description: Server-derived account identity, capabilities, and controlled preference options (disabled until the accounts readiness gate is met)
  - name: consumer-registration
    description: |
      Consumer registration foundation (v0.5.1). Public, unauthenticated, feature-gated.
      Creates pending registrations only; never an account, session, or credential.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /account/me:
    get:
      operationId: getAccountMe
      tags: [account]
      summary: Get the signed-in user's server-derived account summary
      description: |
        Provisions a local account for the trusted identity-provider subject on first call
        (idempotent and race-safe) and returns the account status, locale, onboarding state,
        server-derived capabilities, and whether a separate research registration exists.
        Identity, roles, and capabilities are never taken from the request; any request body
        or query parameter is ignored. Returns 404 while the accounts readiness gate is off.
      responses:
        "200":
          description: Account summary for the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMe"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account is suspended or deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Accounts are not available yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The account could not be provisioned right now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /account/options:
    get:
      operationId: getAccountOptions
      tags: [account]
      summary: Get the controlled neighbourhood and interest lists for account preferences
      description: |
        Returns the server-controlled option lists that preference updates are validated
        against. Preferences are never inferred. Returns 404 while the accounts readiness
        gate is off.
      responses:
        "200":
          description: Controlled option lists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOptions"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Accounts are not available yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /account/preferences:
    patch:
      operationId: updateAccountPreferences
      tags: [account]
      summary: Save controlled account preferences with optimistic concurrency
      description: |
        Creates or updates the signed-in user's optional preferences. `expectedRevision` must equal
        the current stored revision (use 0 when no preferences exist yet); a mismatch returns
        409 VERSION_CONFLICT with the current `expectedVersion` so the client can reload while keeping
        its draft. Every neighbourhood and interest ID is validated against `GET /account/options`;
        unknown IDs return 400 VALIDATION_FAILED with `not_in_controlled_list` field errors. Omitted
        fields stay unchanged; empty arrays clear a list. `locale` updates the account locale. Nothing
        is inferred, and this operation never touches the research registration or saved events.
        Requires a verified identity (403 EMAIL_UNVERIFIED otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountPreferencesInput"
      responses:
        "200":
          description: Updated account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMe"
        "400":
          description: Unknown field or a choice outside the controlled lists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Unverified, suspended, or deleted account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"
        "409":
          $ref: "#/components/responses/VersionConflict"

  /account/onboarding/complete:
    post:
      operationId: completeAccountOnboarding
      tags: [account]
      summary: Mark the optional onboarding step as completed on the server
      description: |
        Records onboarding completion for the signed-in user independently of whether any
        preference exists (skipping is a valid completion). Idempotent: a repeat call keeps the
        original completion time. Creates no preference row, no research registration, and no consent.
      responses:
        "200":
          description: Updated account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMe"
        "400":
          description: Unknown field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Unverified, suspended, or deleted account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"

  /account/consents:
    get:
      operationId: getAccountConsents
      tags: [account]
      summary: Get the current state and history of purpose-specific consents
      description: |
        Returns the current notice version, the derived current state per consent purpose (latest
        ledger entry wins; absent means never asked), and the append-only history. Account creation
        never grants any consent.
      responses:
        "200":
          description: Consent state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountConsents"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Suspended or deleted account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"
    post:
      operationId: recordAccountConsent
      tags: [account]
      summary: Grant or withdraw one purpose-specific consent
      description: |
        Appends one ledger entry for exactly one consent purpose. Entries are never edited or
        deleted. `noticeVersion` must match the current notice version served by
        `GET /account/consents` (400 VALIDATION_FAILED with `stale_notice_version` otherwise), so a
        user never agrees to text they have not seen. Requires a verified identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordAccountConsentInput"
      responses:
        "200":
          description: Consent state after the entry was appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountConsents"
        "400":
          description: Unknown field, unknown purpose, or stale notice version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Unverified, suspended, or deleted account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"

  /account/deletion-requests:
    post:
      operationId: createAccountDeletionRequest
      tags: [account]
      summary: Request deletion of the account
      description: |
        Records a tracked deletion request for the signed-in account. The caller must first
        acknowledge every deletion scope; the research registration and Clerk credentials are
        separate and are not covered by this request. Clients must re-authenticate through Clerk
        immediately before calling this operation. When the requester is the only owner of a
        business the request is stored as `blocked` with `blocked_ownership` until support records
        a transfer, closure, or unpublication decision. Nothing is erased by this call: erasure
        follows the approved retention configuration and a completed support decision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountDeletionRequestInput"
      responses:
        "201":
          description: Request recorded (possibly blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRequest"
        "400":
          description: Invalid or incomplete acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: E-mail must be verified first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"
        "409":
          description: An open deletion request already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /account/requests:
    get:
      operationId: getAccountRequests
      tags: [account]
      summary: List the account's tracked requests
      responses:
        "200":
          description: Requests, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRequests"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"

  /account/requests/{id}/withdraw:
    post:
      operationId: withdrawAccountRequest
      tags: [account]
      summary: Withdraw a request that is not yet in review
      parameters:
        - $ref: "#/components/parameters/AccountRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawAccountRequestInput"
      responses:
        "200":
          description: Request withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRequest"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found or the accounts gate is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          $ref: "#/components/responses/VersionConflict"

  /account/messages:
    get:
      operationId: getAccountMessages
      tags: [account]
      summary: Status of application-owned lifecycle messages
      description: |
        Lists claim, review, publication, and request messages addressed to the account with a
        truthful delivery state: `queued` (not handed to a provider yet), `accepted` (provider
        accepted it), `delivered` (provider confirmed delivery), or `failed`. Message bodies and
        addresses are never returned.
      responses:
        "200":
          description: Messages, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleMessages"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"

  /review/account-requests:
    get:
      operationId: getSupportAccountRequests
      tags: [account-support]
      summary: Support queue of account requests
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountRequestStatus"
      responses:
        "200":
          description: Requests, oldest open first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccountRequests"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Reviewer role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"

  /review/account-requests/{id}/decision:
    post:
      operationId: decideSupportAccountRequest
      tags: [account-support]
      summary: Record a support decision on an account request
      description: |
        `start_review` moves a received or blocked request into review. `resolve_blocker` records
        how one sole-owned business was dealt with: `ownership_transferred` (another owner must
        already exist), `business_closed` (archives the profile), or `business_unpublished`
        (removes it from the public directory). Claims, memberships, and audit history are never
        deleted. `complete` marks the account deleted once no blocker remains; `reject` closes the
        request with `request_rejected`. Every decision is version-bound and appended to the
        request's audit trail. A reviewer cannot decide their own request.
      parameters:
        - $ref: "#/components/parameters/AccountRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportAccountRequestDecisionInput"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccountRequest"
        "400":
          description: Invalid decision for the current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Reviewer role required or self-review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found or the accounts gate is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          $ref: "#/components/responses/VersionConflict"

  /review/lifecycle-messages:
    get:
      operationId: getSupportLifecycleMessages
      tags: [account-support]
      summary: Lifecycle messages for support (exhausted retries first)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LifecycleMessageStatus"
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportLifecycleMessages"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Reviewer role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"

  /review/lifecycle-messages/{id}/resend:
    post:
      operationId: resendSupportLifecycleMessage
      tags: [account-support]
      summary: Re-queue a permanently failed message
      parameters:
        - $ref: "#/components/parameters/LifecycleMessageId"
      responses:
        "200":
          description: Message re-queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportLifecycleMessage"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Reviewer role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Message not found or the accounts gate is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Only failed messages can be re-queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /readiness:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Get the rollout readiness state of gated entry points
      description: Reports which gated feature areas are enabled for this deployment. Flags are read-only and set by the operator environment.
      responses:
        "200":
          description: Readiness flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureReadiness"

  /consumer-registration:
    post:
      operationId: requestConsumerRegistration
      tags: [consumer-registration]
      summary: Submit a secure registration request
      description: |
        Accepts name, email, and phone (contact data only). The response is identical whether the
        address is new, already pending, or already belongs to an account, so account existence
        cannot be inferred (REG-008). A valid new request creates one pending registration and queues
        one registration email transactionally; no account, session, or password is created.
        `returnRef` is an opaque internal return reference validated against an allow-list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerRegistrationRequestInput"
      responses:
        "202":
          description: Request accepted (neutral; does not reveal account state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerRegistrationAccepted"
        "400":
          description: Validation failed (field errors are about format only, never about existence)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: A dependency needed to accept the request is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /consumer-registration/resend:
    post:
      operationId: resendConsumerRegistration
      tags: [consumer-registration]
      summary: Request a fresh registration link
      description: |
        Neutral response regardless of whether a pending registration exists. When one does, every
        earlier link is superseded and exactly one replacement email is queued, subject to cooldown
        and layered rate limits (REG-016, SEC-004).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerRegistrationResendInput"
      responses:
        "202":
          description: Resend accepted (neutral)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerRegistrationAccepted"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"
        "429":
          description: Rate limited (cooldown or budget exceeded; identical for known and unknown addresses)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /consumer-registration/verify:
    get:
      operationId: inspectConsumerRegistrationLink
      tags: [consumer-registration]
      summary: Inspect a registration link without consuming it
      description: |
        Safe, idempotent inspection used when the link is opened. It never consumes the token, so
        mail scanners and link previews cannot burn a single-use link. The handoff page consumes the
        token with an explicit POST.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Link state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerRegistrationLinkState"
        "404":
          $ref: "#/components/responses/FeatureDisabled"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: consumeConsumerRegistrationLink
      tags: [consumer-registration]
      summary: Consume a registration link and reach the handoff state
      description: |
        Marks the newest valid token as used and the registration as verified in one transaction.
        Replaying the same token yields `used`. Does not create an account or a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerRegistrationVerifyInput"
      responses:
        "200":
          description: Resulting link state; `valid` means the handoff was reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerRegistrationLinkState"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /registration:
    get:
      operationId: getRegistration
      tags: [registration]
      summary: Get the signed-in user's registration profile
      responses:
        "200":
          description: Registration status and community participation access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStatus"
        "401":
          description: Authentication is required
    put:
      operationId: saveRegistration
      tags: [registration]
      summary: Create or update the signed-in user's registration profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "200":
          description: Saved registration profile and community participation access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStatus"
        "400":
          description: Invalid registration details
        "401":
          description: Authentication is required

  /weather:
    get:
      operationId: getWeather
      tags: [weather]
      summary: Get a short city weather forecast
      parameters:
        - name: cityId
          in: query
          required: true
          schema:
            type: string
          description: The city identifier (ams, rot, utr, dhg, ein)
      responses:
        "200":
          description: Current conditions and a three-day forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherResponse"
        "400":
          description: Unknown city
        "503":
          description: Weather provider temporarily unavailable

  /capture/search:
    post:
      operationId: captureSearch
      tags: [capture]
      summary: Search for businesses
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureSearchRequest"
      responses:
        "200":
          description: List of matching businesses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessListResult"

  /capture/scan:
    post:
      operationId: captureScan
      tags: [capture]
      summary: Scan a business for events, news, and ads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureScanRequest"
      responses:
        "200":
          description: Scan results (events, news, ads)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResultList"

  /capture/persist:
    post:
      operationId: capturePersist
      tags: [capture]
      summary: Persist selected scan results to the database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapturePersistRequest"
      responses:
        "200":
          description: Number of saved rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersistOutcome"

  /sources/scan:
    post:
      operationId: scanActivitySources
      tags: [source-scanning]
      summary: Deeply scan selected Den Haag sources for activity events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceScanRequest"
      responses:
        "200":
          description: Scan status and discovered event links per source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceScanResponse"
        "400":
          description: Invalid source selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceScanResponse"

  /sources/review:
    get:
      operationId: getEventReviewCandidates
      tags: [event-review]
      summary: Get excluded source-scanned event candidates for editorial review
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, open, rejected]
            default: all
          description: Whether to return open candidates, definitively rejected candidates, or both.
      responses:
        "200":
          description: Candidates that are not currently published in the public event list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventReviewList"

  /sources/review/{id}:
    patch:
      operationId: decideEventReviewCandidate
      tags: [event-review]
      summary: Approve a candidate with verified Hague event details or reject it definitively
      parameters:
        - name: id
          in: path
