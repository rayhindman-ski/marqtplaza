openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: capture
    description: Business event capture operations
  - name: listings
    description: Local business and event listings
  - name: source-scanning
    description: Den Haag activity source scanning
  - name: event-review
    description: Editorial review of source-scanned Den Haag event candidates
  - name: social-map-review
    description: Periodic source review of curated Den Haag support locations
  - name: news
    description: Den Haag news aggregation
  - name: weather
    description: City weather forecast
  - name: community
    description: Resident and organisation community posts
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /weather:
    get:
      operationId: getWeather
      tags: [weather]
      summary: Get a short city weather forecast
      parameters:
        - name: cityId
          in: query
          required: true
          schema:
            type: string
          description: The city identifier (ams, rot, utr, dhg, ein)
      responses:
        "200":
          description: Current conditions and a three-day forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherResponse"
        "400":
          description: Unknown city
        "503":
          description: Weather provider temporarily unavailable

  /capture/search:
    post:
      operationId: captureSearch
      tags: [capture]
      summary: Search for businesses
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureSearchRequest"
      responses:
        "200":
          description: List of matching businesses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessListResult"

  /capture/scan:
    post:
      operationId: captureScan
      tags: [capture]
      summary: Scan a business for events, news, and ads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureScanRequest"
      responses:
        "200":
          description: Scan results (events, news, ads)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResultList"

  /capture/persist:
    post:
      operationId: capturePersist
      tags: [capture]
      summary: Persist selected scan results to the database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapturePersistRequest"
      responses:
        "200":
          description: Number of saved rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersistOutcome"

  /sources/scan:
    post:
      operationId: scanActivitySources
      tags: [source-scanning]
      summary: Deeply scan selected Den Haag sources for activity events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceScanRequest"
      responses:
        "200":
          description: Scan status and discovered event links per source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceScanResponse"
        "400":
          description: Invalid source selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceScanResponse"

  /sources/review:
    get:
      operationId: getEventReviewCandidates
      tags: [event-review]
      summary: Get excluded source-scanned event candidates for editorial review
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, open, rejected]
            default: all
          description: Whether to return open candidates, definitively rejected candidates, or both.
      responses:
        "200":
          description: Candidates that are not currently published in the public event list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventReviewList"

  /sources/review/{id}:
    patch:
      operationId: decideEventReviewCandidate
      tags: [event-review]
      summary: Approve a candidate with verified Hague event details or reject it definitively
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventReviewDecision"
      responses:
        "200":
          description: Updated editorial decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventReviewDecisionResult"
        "400":
          description: Invalid editorial decision
        "404":
          description: Candidate not found
        "409":
          description: Candidate has already received an editorial decision

  /listings:
    get:
      operationId: getListings
      tags: [listings]
      summary: Get local listings for a city
      description: Returns businesses, events, food-and-drink venues, or the curated Den Haag social map for a given city.
      parameters:
        - name: cityId
          in: query
          required: true
          schema:
            type: string
          description: The city identifier (ams, rot, utr, dhg, ein)
        - name: section
          in: query
          required: false
          schema:
            type: string
            enum: [events, businesses, food-drink, social-map]
            default: events
          description: Which Den Haag discovery stream to return.
      responses:
        "200":
          description: Listings result (live or fallback)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingsResponse"
        "400":
          description: Unknown city
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingsResponse"

  /social-map/review:
    get:
      operationId: getSocialMapReview
      tags: [social-map-review]
      summary: Get the curated Den Haag social-map review queue
      description: Returns source status for every curated support location and the last successful public snapshot date.
      responses:
        "200":
          description: Social-map review status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialMapReviewResponse"
        "401":
          description: Authentication is required
        "403":
          description: An editor role is required
    post:
      operationId: runSocialMapReview
      tags: [social-map-review]
      summary: Run the periodic source review for curated support locations
      description: Checks official and verification pages. The public snapshot date changes only when every source check succeeds.
      responses:
        "200":
          description: Completed social-map review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialMapReviewResponse"
        "401":
          description: Authentication is required
        "403":
          description: An editor role is required
        "409":
          description: A review is already in progress
        "502":
          description: The review could not be completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required: [error]

  /news:
    get:
      operationId: getNews
      tags: [news]
      summary: Get published Den Haag news
      parameters:
        - name: subcategory
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NewsSubcategory"
      responses:
        "200":
          description: Published news feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsFeed"

  /news/{id}:
    get:
      operationId: getNewsArticle
      tags: [news]
      summary: Get one published news article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Published article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticle"
        "404":
          description: Article not found

  /news/sources/status:
    get:
      operationId: getNewsSourceStatuses
      tags: [news]
      summary: Get the latest scan status for approved news sources
      responses:
        "200":
          description: Latest scan status and retry time per approved source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsSourceStatusResponse"

  /news/scan:
    post:
      operationId: scanNewsSources
      tags: [news]
      summary: Crawl selected approved Den Haag news sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsScanRequest"
      responses:
        "200":
          description: Per-source news crawl results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsScanResponse"
        "400":
          description: Invalid source selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsScanResponse"

  /community-posts:
    get:
      operationId: getCommunityPosts
      tags: [community]
      summary: Get approved active community posts
      parameters:
        - name: cityId
          in: query
          required: true
          schema:
            type: string
        - name: neighborhood
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CommunityPostType"
      responses:
        "200":
          description: Active approved posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPostList"
        "400":
          description: Invalid city or post type
    post:
      operationId: createCommunityPost
      tags: [community]
      summary: Submit a community post for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPostInput"
      responses:
        "201":
          description: Submitted post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPostSubmission"
        "400":
          description: Invalid community post
        "401":
          description: Authentication is required

  /community-posts/moderation:
    get:
      operationId: getCommunityModerationPosts
      tags: [community]
      summary: Get the community moderation queue
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, all]
            default: pending
      responses:
        "200":
          description: Moderation queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPostList"
        "401":
          description: Authentication is required
        "403":
          description: An editor role is required

  /community-posts/moderation/{id}:
    patch:
      operationId: decideCommunityPost
      tags: [community]
      summary: Approve or reject a community post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPostDecision"
      responses:
        "200":
          description: Updated moderation item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPost"
        "400":
          description: Invalid moderation decision
        "401":
          description: Authentication is required
        "403":
          description: An editor role is required
        "404":
          description: Post not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CommunityPostType:
      type: string
      enum: [event, question, help_offer, help_request, tip, announcement]

    CommunityPostStatus:
      type: string
      enum: [pending, approved, rejected]

    CommunityPost:
      type: object
      properties:
        id:
          type: number
        cityId:
          type: string
        neighborhood:
          type: ["string", "null"]
        type:
          $ref: "#/components/schemas/CommunityPostType"
        title:
          type: string
        body:
          type: string
        startsAt:
          type: ["string", "null"]
        expiresAt:
          type: string
        status:
          $ref: "#/components/schemas/CommunityPostStatus"
        reviewNote:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, cityId, type, title, body, expiresAt, status, createdAt]

    CommunityPostInput:
      type: object
      properties:
        cityId:
          type: string
          minLength: 1
        neighborhood:
          type: ["string", "null"]
        type:
          $ref: "#/components/schemas/CommunityPostType"
        title:
          type: string
          minLength: 3
          maxLength: 120
        body:
          type: string
          minLength: 10
          maxLength: 2000
        startsAt:
          type: ["string", "null"]
        expiresAt:
          type: string
      required: [cityId, type, title, body, expiresAt]

    CommunityPostSubmission:
      type: object
      properties:
        id:
          type: number
        status:
          $ref: "#/components/schemas/CommunityPostStatus"
        message:
          type: string
      required: [id, status, message]

    CommunityPostDecision:
      type: object
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reviewNote:
          type: string
          maxLength: 500
      required: [decision]

    CommunityPostList:
      type: array
      items:
        $ref: "#/components/schemas/CommunityPost"

    WeatherResponse:
      type: object
      properties:
        cityId:
          type: string
        locationName:
          type: string
        fetchedAt:
          type: string
        current:
          $ref: "#/components/schemas/WeatherCurrent"
        forecast:
          type: array
          items:
            $ref: "#/components/schemas/WeatherDay"
        provider:
          type: string
          enum: [open-meteo]
      required: [cityId, locationName, fetchedAt, current, forecast, provider]

    WeatherCurrent:
      type: object
      properties:
        temperature:
          type: number
        apparentTemperature:
          type: number
        precipitation:
          type: number
        windSpeed:
          type: number
        weatherCode:
          type: number
        condition:
          $ref: "#/components/schemas/WeatherCondition"
        isDay:
          type: boolean
      required: [temperature, apparentTemperature, precipitation, windSpeed, weatherCode, condition, isDay]

    WeatherDay:
      type: object
      properties:
        date:
          type: string
        high:
          type: number
        low:
          type: number
        precipitationProbability:
          type: number
        weatherCode:
          type: number
        condition:
          $ref: "#/components/schemas/WeatherCondition"
      required: [date, high, low, precipitationProbability, weatherCode, condition]

    WeatherCondition:
      type: string
      enum: [clear, partly_cloudy, cloudy, fog, drizzle, rain, snow, showers, thunderstorm, unknown]

    CaptureSearchRequest:
      type: object
      properties:
        url:
          type: string
        businessName:
          type: string
        zipCode:
          type: string
        neighbourhood:
          type: string

    CaptureSearchBusiness:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        zipCode:
          type: string
        address:
          type: string
      required: [id, name, zipCode, address]

    BusinessListResult:
      type: object
      properties:
        businesses:
          type: array
          items:
            $ref: "#/components/schemas/CaptureSearchBusiness"
      required: [businesses]

    CaptureScanRequest:
      type: object
      properties:
        businessId:
          type: string
        name:
          type: string
        url:
          type: string
      required: []

    CaptureScanResult:
      type: object
      properties:
        type:
          type: string
          enum: [news, event, ad]
        title:
          type: string
        sourceUrl:
          type: string
        publishedAt:
          type: string
      required: [type, title]

    ScanResultList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/CaptureScanResult"
      required: [results]

    CapturePersistResult:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        sourceUrl:
          type: string
        publishedAt:
          type: string
      required: [type, title]

    CapturePersistRequest:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/CapturePersistResult"
        businessName:
          type: string
        businessUrl:
          type: string
        zipCode:
          type: string
      required: [results]

    PersistOutcome:
      type: object
      properties:
        saved:
          type: number
      required: [saved]

    SourceScanRequest:
      type: object
      properties:
        sourceIds:
          type: array
          minItems: 1
          maxItems: 29
          items:
            type: string
      required: [sourceIds]

    SourceScanEvent:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        context:
          type: string
        description:
          type: string
        startsAt:
          type: string
        venue:
          type: string
        category:
          type: string
          enum: [Museums, Tours, Family, Entertainment, Outdoors, Markets]
        sourceGroup:
          type: string
          enum: [city-agenda, culture, community, meals]
        organizer:
          type: string
        activityKind:
          type: string
          enum: [community, culture, learning, movement, meal, family, market, outdoor, entertainment]
        priceType:
          type: string
          enum: [free, low-cost, paid, unknown]
        priceText:
          type: string
        mealType:
          type: string
          enum: [community-meal, food-support]
        audience:
          type: string
        neighborhood:
          type: string
        recurrenceText:
          type: string
        reviewReason:
          type: string
          enum: [missing_date, out_of_window, missing_locality, foreign_location]
      required: [title, url]

    SourceScanResult:
      type: object
      properties:
        sourceId:
          type: string
        sourceName:
          type: string
        scannedUrl:
          type: string
        status:
          type: string
          enum: [found, partial, no_events, blocked, error]
        events:
          type: array
          items:
            $ref: "#/components/schemas/SourceScanEvent"
        eventLinksRead:
          type: number
          minimum: 0
          description: Number of same-source links examined across approved index and detail pages.
        eventsCaptured:
          type: number
          minimum: 0
          description: Number of unique event links captured from the source page.
        eventsEligible:
          type: number
          minimum: 0
          description: Captured events with a verified upcoming date and Den Haag evidence that are eligible for publication.
        eventsMissingDate:
          type: number
          minimum: 0
          description: Captured events excluded because no explicit event date could be parsed.
        eventsOutOfWindow:
          type: number
          minimum: 0
          description: Captured events excluded because their date is past or more than 18 months away.
        eventsMissingLocality:
          type: number
          minimum: 0
          description: Captured events excluded because no Den Haag location evidence was found.
        eventsForeignLocation:
          type: number
          minimum: 0
          description: Captured events excluded because available evidence establishes a location outside the Netherlands.
        pagesRead:
          type: number
          minimum: 0
          description: Number of approved source pages read during the bounded crawl.
        pagesFailed:
          type: number
          minimum: 0
          description: Number of approved source pages that could not be read.
        pagesSkipped:
          type: number
          minimum: 0
          description: Discovered pages skipped because a safe crawl budget was reached.
        indexPagesRead:
          type: number
          minimum: 0
          description: Calendar, archive, or pagination pages read during the crawl.
        detailPagesRead:
          type: number
          minimum: 0
          description: Candidate event detail pages read during the crawl.
        sitemapsRead:
          type: number
          minimum: 0
          description: Approved sitemap pages read during the crawl.
        robotsPagesSkipped:
          type: number
          minimum: 0
          description: Discovered same-origin pages skipped because the source's robots.txt policy disallows them for this crawler.
        crawlLimitReached:
          type: boolean
          description: Whether one or more safe per-source crawl limits truncated further discovery.
        eventsAdded:
          type: number
          minimum: 0
          description: Number of newly persisted events added to the Den Haag activity list.
        eventsUpdated:
          type: number
          minimum: 0
          description: Number of previously discovered events refreshed by this scan.
        eventsSkipped:
          type: number
          minimum: 0
          description: Captured events excluded from public listings because they did not meet publication checks.
        message:
          type: string
      required: [sourceId, sourceName, scannedUrl, status, events, eventLinksRead, eventsCaptured, eventsEligible, eventsMissingDate, eventsOutOfWindow, eventsMissingLocality, eventsForeignLocation, pagesRead, pagesFailed, pagesSkipped, indexPagesRead, detailPagesRead, sitemapsRead, robotsPagesSkipped, crawlLimitReached, eventsAdded, eventsUpdated, eventsSkipped]

    SourceScanResponse:
      type: object
      properties:
        scannedAt:
          type: string
        scans:
          type: array
          items:
            $ref: "#/components/schemas/SourceScanResult"
        error:
          type: string
      required: [scannedAt, scans]

    EventReviewCandidate:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        sourceName:
          type: string
        sourceUrl:
          type: string
        description:
          type: string
        startsAt:
          type: [string, "null"]
        venue:
          type: [string, "null"]
        category:
          type: string
        sourceGroup:
          type: string
        organizer:
          type: [string, "null"]
        activityKind:
          type: [string, "null"]
        priceType:
          type: string
        priceText:
          type: [string, "null"]
        mealType:
          type: [string, "null"]
        audience:
          type: [string, "null"]
        neighborhood:
          type: [string, "null"]
        recurrenceText:
          type: [string, "null"]
        lat:
          type: number
        lng:
          type: number
        status:
          type: string
          enum: [approved, pending_review, rejected]
        reason:
          type: [string, "null"]
          enum: [missing_date, out_of_window, missing_locality, foreign_location, manual_rejection, null]
        evidenceUrl:
          type: [string, "null"]
        firstSeenAt:
          type: string
        lastSeenAt:
          type: string
        reviewedAt:
          type: [string, "null"]
      required: [id, title, sourceName, sourceUrl, description, startsAt, venue, category, lat, lng, status, reason, evidenceUrl, firstSeenAt, lastSeenAt, reviewedAt]

    EventReviewList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventReviewCandidate"
        counts:
          type: object
          properties:
            pending:
              type: number
            rejected:
              type: number
          required: [pending, rejected]
      required: [items, counts]

    EventReviewDecision:
      type: object
      properties:
        decision:
          type: string
          enum: [approve, reject]
        startsAt:
          type: string
        venue:
          type: string
        lat:
          type: number
        lng:
          type: number
        evidenceUrl:
          type: string
      required: [decision]

    EventReviewDecisionResult:
      type: object
      properties:
        item:
          $ref: "#/components/schemas/EventReviewCandidate"
      required: [item]

    Listing:
      type: object
      properties:
        id:
          type: string
        locationId:
          type: string
        category:
          type: string
          enum: [Museums, Tours, Family, Entertainment, Outdoors, Markets, Businesses, Food & Drink, Social map]
        name:
          type: string
        address:
          type: string
          description: Provider-supplied or curated visitor address when one is available.
        description:
          type: string
        startsAt:
          type: string
          description: Verified upcoming event start date and time when this listing is an event.
        x:
          type: number
        y:
          type: number
        details:
          type: string
        lat:
          type: number
          description: WGS 84 latitude for displaying the activity on the map.
        lng:
          type: number
          description: WGS 84 longitude for displaying the activity on the map.
        sourceUrl:
          type: string
          description: Link to the website where this activity was listed.
        businessCategory:
          $ref: "#/components/schemas/BusinessCategory"
        source:
          $ref: "#/components/schemas/ListingSource"
        sourceName:
          type: string
          description: Human-readable publisher or provider that listed this item, distinct from its destination URL.
        isApproximateLocation:
          type: boolean
          description: Whether the map pin uses the Den Haag city centre because no exact venue coordinates were supplied.
        sourceGroup:
          type: string
          enum: [city-agenda, culture, community, meals]
          description: The approved source stream that supplied this event.
        organizer:
          type: string
          description: The organizer explicitly named by the source.
        activityKind:
          type: string
          enum: [community, culture, learning, movement, meal, family, market, outdoor, entertainment]
        priceType:
          type: string
          enum: [free, low-cost, paid, unknown]
          description: Price access is only shown when the source gives explicit evidence.
        priceText:
          type: string
        mealType:
          type: string
          enum: [community-meal, food-support]
        audience:
          type: string
        recurrenceText:
          type: string
        neighborhood:
          type: string
          description: Den Haag neighborhood context for a curated social-map location.
        socialCategory:
          $ref: "#/components/schemas/SocialMapCategory"
        officialUrl:
          type: string
          description: Verified organization or service website for a social-map location.
        sourcePageUrl:
          type: string
          description: Public source page used to verify a social-map location.
        snapshotDate:
          type: string
          description: Date the curated social-map selection was last checked.
        reviewStatus:
          $ref: "#/components/schemas/SocialMapReviewStatus"
        reviewReason:
          type: string
          nullable: true
          description: Why this social-map record needs editorial attention, when applicable.
        lastCheckedAt:
          type: string
          description: Date or timestamp of the latest source review for this record.
        nextReviewAt:
          type: string
          description: Scheduled date for the next source review.
      required:
        - id
        - locationId
        - category
        - name
        - description
        - x
        - y
        - details
        - lat
        - lng

    BusinessCategory:
      type: string
      description: Normalized category for business and food-and-drink listings.
      enum:
        - Retail & Shopping
        - Food & Drink
        - Health & Wellness
        - Beauty & Personal Care
        - Professional Services
        - Finance & Legal
        - Home & Repair
        - Automotive & Mobility
        - Education & Childcare
        - Hospitality & Travel
        - Arts, Culture & Entertainment
        - Fitness & Sports

    ListingSource:
      type: string
      description: Provider or editorial source for an individual listing.
      enum: [google_maps, openstreetmap, curated, source_scan]

    SocialMapCategory:
      type: string
      description: Curated support theme for the Den Haag social map.
      enum:
        - Geldzaken
        - Gezin en opvoeden
        - Gezondheid
        - Hobby's en interesses
        - Ondersteuning
        - Ontmoeten en samenleven
        - Sporten en bewegen
        - Taal en computer
        - Vervoer
        - Werk en opleiding
        - Wonen en huishouden
        - Zorg voor een naaste

    SocialMapReviewStatus:
      type: string
      description: Public-safe status of a curated social-map record.
      enum: [verified, review_due, changed, unavailable]

    SocialMapSourceStatus:
      type: string
      description: Result of checking one official or verification source page.
      enum: [available, redirected, unavailable, address_mismatch]

    SocialMapSourceKind:
      type: string
      enum: [official_url, source_page_url]

    SocialMapReviewCheck:
      type: object
      properties:
        listingId:
          type: string
        kind:
          $ref: "#/components/schemas/SocialMapSourceKind"
        url:
          type: string
        status:
          $ref: "#/components/schemas/SocialMapSourceStatus"
        httpStatus:
          type: number
          nullable: true
        finalUrl:
          type: string
          nullable: true
        checkedAt:
          type: string
        message:
          type: string
      required: [listingId, kind, url, status, httpStatus, finalUrl, checkedAt]

    SocialMapReviewItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        officialUrl:
          type: string
        sourcePageUrl:
          type: string
        status:
          $ref: "#/components/schemas/SocialMapReviewStatus"
        sourceStatus:
          $ref: "#/components/schemas/SocialMapSourceStatus"
        reason:
          type: string
          nullable: true
        lastCheckedAt:
          type: string
        nextReviewAt:
          type: string
      required: [id, name, address, officialUrl, sourcePageUrl, status, sourceStatus, reason, lastCheckedAt, nextReviewAt]

    SocialMapReviewResponse:
      type: object
      properties:
        snapshotDate:
          type: string
          description: Last date on which every source check succeeded.
        lastRunAt:
          type: string
          nullable: true
        successful:
          type: boolean
        intervalDays:
          type: number
          minimum: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/SocialMapReviewItem"
        checks:
          type: array
          items:
            $ref: "#/components/schemas/SocialMapReviewCheck"
        message:
          type: string
      required: [snapshotDate, lastRunAt, successful, intervalDays, items, checks, message]

    ListingsResponse:
      type: object
      properties:
        listings:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        source:
          type: string
          enum: [live, google_places, fallback, curated]
        message:
          type: string
      required:
        - listings
        - source

    NewsSubcategory:
      type: string
      enum: [city, politics, safety, culture, sport, business, community]

    NewsArticle:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        summary:
          type: string
        sourceName:
          type: string
        sourceUrl:
          type: string
        subcategory:
          $ref: "#/components/schemas/NewsSubcategory"
        publishedAt:
          type: ["string", "null"]
      required: [id, title, summary, sourceName, sourceUrl, subcategory, publishedAt]

    NewsFeed:
      type: object
      properties:
        articles:
          type: array
          items:
            $ref: "#/components/schemas/NewsArticle"
        availableSubcategories:
          type: array
          items:
            $ref: "#/components/schemas/NewsSubcategory"
      required: [articles, availableSubcategories]

    NewsSourceStatus:
      type: object
      properties:
        sourceId:
          type: string
        sourceName:
          type: string
        sourceUrl:
          type: string
        status:
          type: string
          enum: [pending, found, partial, no_articles, blocked, error]
        lastScannedAt:
          type: ["string", "null"]
        nextScanAt:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
        articlesCaptured:
          type: number
        articlesPublished:
          type: number
        articlesUpdated:
          type: number
        pagesFailed:
          type: number
      required: [sourceId, sourceName, sourceUrl, status, lastScannedAt, nextScanAt, message, articlesCaptured, articlesPublished, articlesUpdated, pagesFailed]

    NewsSourceStatusResponse:
      type: object
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/NewsSourceStatus"
      required: [sources]

    NewsScanRequest:
      type: object
      properties:
        sourceIds:
          type: array
          minItems: 1
          maxItems: 23
          items:
            type: string
      required: [sourceIds]

    NewsSourceScan:
      type: object
      properties:
        sourceId:
          type: string
        sourceName:
          type: string
        scannedUrl:
          type: string
        status:
          type: string
          enum: [found, partial, no_articles, blocked, error]
        articlesCaptured:
          type: number
        articlesPublished:
          type: number
        articlesUpdated:
          type: number
        articlesRejected:
          type: number
        pagesRead:
          type: number
        pagesFailed:
          type: number
        crawlLimitReached:
          type: boolean
        message:
          type: string
      required: [sourceId, sourceName, scannedUrl, status, articlesCaptured, articlesPublished, articlesUpdated, articlesRejected, pagesRead, pagesFailed, crawlLimitReached, message]

    NewsScanResponse:
      type: object
      properties:
        scannedAt:
          type: string
        scans:
          type: array
          items:
            $ref: "#/components/schemas/NewsSourceScan"
        error:
          type: string
      required: [scannedAt, scans]
