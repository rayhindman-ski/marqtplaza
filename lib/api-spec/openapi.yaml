openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: capture
    description: Business event capture operations
  - name: listings
    description: Local business and event listings
  - name: source-scanning
    description: Den Haag activity source scanning
  - name: news
    description: Den Haag news aggregation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /capture/search:
    post:
      operationId: captureSearch
      tags: [capture]
      summary: Search for businesses
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureSearchRequest"
      responses:
        "200":
          description: List of matching businesses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessListResult"

  /capture/scan:
    post:
      operationId: captureScan
      tags: [capture]
      summary: Scan a business for events, news, and ads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureScanRequest"
      responses:
        "200":
          description: Scan results (events, news, ads)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResultList"

  /capture/persist:
    post:
      operationId: capturePersist
      tags: [capture]
      summary: Persist selected scan results to the database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapturePersistRequest"
      responses:
        "200":
          description: Number of saved rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersistOutcome"

  /sources/scan:
    post:
      operationId: scanActivitySources
      tags: [source-scanning]
      summary: Deeply scan selected Den Haag sources for activity events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceScanRequest"
      responses:
        "200":
          description: Scan status and discovered event links per source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceScanResponse"
        "400":
          description: Invalid source selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceScanResponse"

  /listings:
    get:
      operationId: getListings
      tags: [listings]
      summary: Get local listings for a city
      description: Returns businesses, events, and specials for a given city. Falls back gracefully when the live data provider is unavailable.
      parameters:
        - name: cityId
          in: query
          required: true
          schema:
            type: string
          description: The city identifier (ams, rot, utr, dhg, ein)
        - name: section
          in: query
          required: false
          schema:
            type: string
            enum: [events, businesses, food-drink]
            default: events
          description: Which Den Haag discovery stream to return.
      responses:
        "200":
          description: Listings result (live or fallback)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingsResponse"
        "400":
          description: Unknown city
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingsResponse"

  /news:
    get:
      operationId: getNews
      tags: [news]
      summary: Get published Den Haag news
      parameters:
        - name: subcategory
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NewsSubcategory"
      responses:
        "200":
          description: Published news feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsFeed"

  /news/{id}:
    get:
      operationId: getNewsArticle
      tags: [news]
      summary: Get one published news article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Published article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticle"
        "404":
          description: Article not found

  /news/scan:
    post:
      operationId: scanNewsSources
      tags: [news]
      summary: Crawl selected approved Den Haag news sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsScanRequest"
      responses:
        "200":
          description: Per-source news crawl results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsScanResponse"
        "400":
          description: Invalid source selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsScanResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CaptureSearchRequest:
      type: object
      properties:
        url:
          type: string
        businessName:
          type: string
        zipCode:
          type: string
        neighbourhood:
          type: string

    CaptureSearchBusiness:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        zipCode:
          type: string
        address:
          type: string
      required: [id, name, zipCode, address]

    BusinessListResult:
      type: object
      properties:
        businesses:
          type: array
          items:
            $ref: "#/components/schemas/CaptureSearchBusiness"
      required: [businesses]

    CaptureScanRequest:
      type: object
      properties:
        businessId:
          type: string
        name:
          type: string
        url:
          type: string
      required: []

    CaptureScanResult:
      type: object
      properties:
        type:
          type: string
          enum: [news, event, ad]
        title:
          type: string
        sourceUrl:
          type: string
        publishedAt:
          type: string
      required: [type, title]

    ScanResultList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/CaptureScanResult"
      required: [results]

    CapturePersistResult:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        sourceUrl:
          type: string
        publishedAt:
          type: string
      required: [type, title]

    CapturePersistRequest:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/CapturePersistResult"
        businessName:
          type: string
        businessUrl:
          type: string
        zipCode:
          type: string
      required: [results]

    PersistOutcome:
      type: object
      properties:
        saved:
          type: number
      required: [saved]

    SourceScanRequest:
      type: object
      properties:
        sourceIds:
          type: array
          minItems: 1
          maxItems: 24
          items:
            type: string
      required: [sourceIds]

    SourceScanEvent:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        context:
          type: string
        description:
          type: string
        startsAt:
          type: string
        venue:
          type: string
        category:
          type: string
          enum: [Museums, Tours, Family, Entertainment, Outdoors, Markets]
      required: [title, url]

    SourceScanResult:
      type: object
      properties:
        sourceId:
          type: string
        sourceName:
          type: string
        scannedUrl:
          type: string
        status:
          type: string
          enum: [found, partial, no_events, blocked, error]
        events:
          type: array
          items:
            $ref: "#/components/schemas/SourceScanEvent"
        eventLinksRead:
          type: number
          minimum: 0
          description: Number of same-source links examined across approved index and detail pages.
        eventsCaptured:
          type: number
          minimum: 0
          description: Number of unique event links captured from the source page.
        eventsEligible:
          type: number
          minimum: 0
          description: Captured events with a verified upcoming date and Den Haag evidence that are eligible for publication.
        eventsMissingDate:
          type: number
          minimum: 0
          description: Captured events excluded because no explicit event date could be parsed.
        eventsOutOfWindow:
          type: number
          minimum: 0
          description: Captured events excluded because their date is past or more than 18 months away.
        eventsMissingLocality:
          type: number
          minimum: 0
          description: Captured events excluded because no Den Haag location evidence was found.
        pagesRead:
          type: number
          minimum: 0
          description: Number of approved source pages read during the bounded crawl.
        pagesFailed:
          type: number
          minimum: 0
          description: Number of approved source pages that could not be read.
        pagesSkipped:
          type: number
          minimum: 0
          description: Discovered pages skipped because a safe crawl budget was reached.
        indexPagesRead:
          type: number
          minimum: 0
          description: Calendar, archive, or pagination pages read during the crawl.
        detailPagesRead:
          type: number
          minimum: 0
          description: Candidate event detail pages read during the crawl.
        sitemapsRead:
          type: number
          minimum: 0
          description: Approved sitemap pages read during the crawl.
        robotsPagesSkipped:
          type: number
          minimum: 0
          description: Discovered same-origin pages skipped because the source's robots.txt policy disallows them for this crawler.
        crawlLimitReached:
          type: boolean
          description: Whether one or more safe per-source crawl limits truncated further discovery.
        eventsAdded:
          type: number
          minimum: 0
          description: Number of newly persisted events added to the Den Haag activity list.
        eventsUpdated:
          type: number
          minimum: 0
          description: Number of previously discovered events refreshed by this scan.
        eventsSkipped:
          type: number
          minimum: 0
          description: Captured events excluded from public listings because they did not meet publication checks.
        message:
          type: string
      required: [sourceId, sourceName, scannedUrl, status, events, eventLinksRead, eventsCaptured, eventsEligible, eventsMissingDate, eventsOutOfWindow, eventsMissingLocality, pagesRead, pagesFailed, pagesSkipped, indexPagesRead, detailPagesRead, sitemapsRead, robotsPagesSkipped, crawlLimitReached, eventsAdded, eventsUpdated, eventsSkipped]

    SourceScanResponse:
      type: object
      properties:
        scannedAt:
          type: string
        scans:
          type: array
          items:
            $ref: "#/components/schemas/SourceScanResult"
        error:
          type: string
      required: [scannedAt, scans]

    Listing:
      type: object
      properties:
        id:
          type: string
        locationId:
          type: string
        category:
          type: string
          enum: [Museums, Tours, Family, Entertainment, Outdoors, Markets, Businesses, Food & Drink]
        name:
          type: string
        description:
          type: string
        x:
          type: number
        y:
          type: number
        details:
          type: string
        lat:
          type: number
          description: WGS 84 latitude for displaying the activity on the map.
        lng:
          type: number
          description: WGS 84 longitude for displaying the activity on the map.
        sourceUrl:
          type: string
          description: Link to the website where this activity was listed.
        businessCategory:
          $ref: "#/components/schemas/BusinessCategory"
        source:
          $ref: "#/components/schemas/ListingSource"
        sourceName:
          type: string
          description: Human-readable publisher or provider that listed this item, distinct from its destination URL.
        isApproximateLocation:
          type: boolean
          description: Whether the map pin uses the Den Haag city centre because no exact venue coordinates were supplied.
      required:
        - id
        - locationId
        - category
        - name
        - description
        - x
        - y
        - details
        - lat
        - lng

    BusinessCategory:
      type: string
      description: Normalized category for business and food-and-drink listings.
      enum:
        - Retail & Shopping
        - Food & Drink
        - Health & Wellness
        - Beauty & Personal Care
        - Professional Services
        - Finance & Legal
        - Home & Repair
        - Automotive & Mobility
        - Education & Childcare
        - Hospitality & Travel
        - Arts, Culture & Entertainment
        - Fitness & Sports

    ListingSource:
      type: string
      description: Provider or editorial source for an individual listing.
      enum: [google_maps, openstreetmap, curated, source_scan]

    ListingsResponse:
      type: object
      properties:
        listings:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        source:
          type: string
          enum: [live, google_places, fallback, curated]
        message:
          type: string
      required:
        - listings
        - source

    NewsSubcategory:
      type: string
      enum: [city, politics, safety, culture, sport, business, community]

    NewsArticle:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        summary:
          type: string
        sourceName:
          type: string
        sourceUrl:
          type: string
        subcategory:
          $ref: "#/components/schemas/NewsSubcategory"
        publishedAt:
          type: ["string", "null"]
      required: [id, title, summary, sourceName, sourceUrl, subcategory, publishedAt]

    NewsFeed:
      type: object
      properties:
        articles:
          type: array
          items:
            $ref: "#/components/schemas/NewsArticle"
        availableSubcategories:
          type: array
          items:
            $ref: "#/components/schemas/NewsSubcategory"
      required: [articles, availableSubcategories]

    NewsScanRequest:
      type: object
      properties:
        sourceIds:
          type: array
          minItems: 1
          maxItems: 23
          items:
            type: string
      required: [sourceIds]

    NewsSourceScan:
      type: object
      properties:
        sourceId:
          type: string
        sourceName:
          type: string
        scannedUrl:
          type: string
        status:
          type: string
          enum: [found, partial, no_articles, blocked, error]
        articlesCaptured:
          type: number
        articlesPublished:
          type: number
        articlesUpdated:
          type: number
        articlesRejected:
          type: number
        pagesRead:
          type: number
        pagesFailed:
          type: number
        crawlLimitReached:
          type: boolean
        message:
          type: string
      required: [sourceId, sourceName, scannedUrl, status, articlesCaptured, articlesPublished, articlesUpdated, articlesRejected, pagesRead, pagesFailed, crawlLimitReached, message]

    NewsScanResponse:
      type: object
      properties:
        scannedAt:
          type: string
        scans:
          type: array
          items:
            $ref: "#/components/schemas/NewsSourceScan"
        error:
          type: string
      required: [scannedAt, scans]
