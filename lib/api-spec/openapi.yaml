        lastResetAt:
          type: ["string", "null"]
      required: [used, limit, exhausted, updatedAt, lastResetAt]

    NewsSubcategory:
      type: string
      enum: [city, politics, safety, culture, sport, business, community]

    NewsArticle:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        summary:
          type: string
        sourceName:
          type: string
        sourceUrl:
          type: string
        subcategory:
          $ref: "#/components/schemas/NewsSubcategory"
        publishedAt:
          type: ["string", "null"]
      required: [id, title, summary, sourceName, sourceUrl, subcategory, publishedAt]

    NewsFeed:
      type: object
      properties:
        articles:
          type: array
          items:
            $ref: "#/components/schemas/NewsArticle"
        availableSubcategories:
          type: array
          items:
            $ref: "#/components/schemas/NewsSubcategory"
      required: [articles, availableSubcategories]

    NewsSourceStatus:
      type: object
      properties:
        sourceId:
          type: string
        sourceName:
          type: string
        sourceUrl:
          type: string
        status:
          type: string
          enum: [pending, found, partial, no_articles, blocked, error]
        lastScannedAt:
          type: ["string", "null"]
        nextScanAt:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
        articlesCaptured:
          type: number
        articlesPublished:
          type: number
        articlesUpdated:
          type: number
        pagesFailed:
          type: number
      required: [sourceId, sourceName, sourceUrl, status, lastScannedAt, nextScanAt, message, articlesCaptured, articlesPublished, articlesUpdated, pagesFailed]

    NewsSourceStatusResponse:
      type: object
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/NewsSourceStatus"
      required: [sources]

    NewsScanRequest:
      type: object
      properties:
        sourceIds:
          type: array
          minItems: 1
          maxItems: 23
          items:
            type: string
      required: [sourceIds]

    NewsSourceScan:
      type: object
      properties:
        sourceId:
          type: string
        sourceName:
          type: string
        scannedUrl:
          type: string
        status:
          type: string
          enum: [found, partial, no_articles, blocked, error]
        articlesCaptured:
          type: number
        articlesPublished:
          type: number
        articlesUpdated:
          type: number
        articlesRejected:
          type: number
        pagesRead:
          type: number
        pagesFailed:
          type: number
        crawlLimitReached:
          type: boolean
        message:
          type: string
      required: [sourceId, sourceName, scannedUrl, status, articlesCaptured, articlesPublished, articlesUpdated, articlesRejected, pagesRead, pagesFailed, crawlLimitReached, message]

    NewsScanResponse:
      type: object
      properties:
        scannedAt:
          type: string
        scans:
          type: array
          items:
            $ref: "#/components/schemas/NewsSourceScan"
        error:
          type: string
      required: [scannedAt, scans]
