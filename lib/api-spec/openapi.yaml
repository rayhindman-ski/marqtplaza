openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: capture
    description: Business event capture operations
  - name: listings
    description: Local business and event listings
  - name: source-scanning
    description: Den Haag activity source scanning
  - name: event-review
    description: Editorial review of source-scanned Den Haag event candidates
  - name: social-map-review
    description: Periodic source review of curated Den Haag support locations
  - name: news
    description: Den Haag news aggregation
  - name: weather
    description: City weather forecast
  - name: community
    description: Resident and organisation community posts
  - name: businesses
    description: Business claims, profiles, and local deals
  - name: saved-events
    description: Account-backed saved event snapshots and alerts
  - name: registration
    description: Authenticated community registration and participation eligibility
  - name: account
    description: Server-derived account identity, capabilities, and controlled preference options (disabled until the accounts readiness gate is met)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /account/me:
    get:
      operationId: getAccountMe
      tags: [account]
      summary: Get the signed-in user's server-derived account summary
      description: |
        Provisions a local account for the trusted identity-provider subject on first call
        (idempotent and race-safe) and returns the account status, locale, onboarding state,
        server-derived capabilities, and whether a separate research registration exists.
        Identity, roles, and capabilities are never taken from the request; any request body
        or query parameter is ignored. Returns 404 while the accounts readiness gate is off.
      responses:
        "200":
          description: Account summary for the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMe"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account is suspended or deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Accounts are not available yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The account could not be provisioned right now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /account/options:
    get:
      operationId: getAccountOptions
      tags: [account]
      summary: Get the controlled neighbourhood and interest lists for account preferences
      description: |
        Returns the server-controlled option lists that preference updates are validated
        against. Preferences are never inferred. Returns 404 while the accounts readiness
        gate is off.
      responses:
        "200":
          description: Controlled option lists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOptions"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Accounts are not available yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /account/preferences:
    patch:
      operationId: updateAccountPreferences
      tags: [account]
      summary: Save controlled account preferences with optimistic concurrency
      description: |
        Creates or updates the signed-in user's optional preferences. `expectedRevision` must equal
        the current stored revision (use 0 when no preferences exist yet); a mismatch returns
        409 VERSION_CONFLICT with the current `expectedVersion` so the client can reload while keeping
        its draft. Every neighbourhood and interest ID is validated against `GET /account/options`;
        unknown IDs return 400 VALIDATION_FAILED with `not_in_controlled_list` field errors. Omitted
        fields stay unchanged; empty arrays clear a list. `locale` updates the account locale. Nothing
        is inferred, and this operation never touches the research registration or saved events.
        Requires a verified identity (403 EMAIL_UNVERIFIED otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountPreferencesInput"
      responses:
        "200":
          description: Updated account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMe"
        "400":
          description: Unknown field or a choice outside the controlled lists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Unverified, suspended, or deleted account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"
        "409":
          $ref: "#/components/responses/VersionConflict"

  /account/onboarding/complete:
    post:
      operationId: completeAccountOnboarding
      tags: [account]
      summary: Mark the optional onboarding step as completed on the server
      description: |
        Records onboarding completion for the signed-in user independently of whether any
        preference exists (skipping is a valid completion). Idempotent: a repeat call keeps the
        original completion time. Creates no preference row, no research registration, and no consent.
      responses:
        "200":
          description: Updated account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMe"
        "400":
          description: Unknown field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Unverified, suspended, or deleted account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"

  /account/consents:
    get:
      operationId: getAccountConsents
      tags: [account]
      summary: Get the current state and history of purpose-specific consents
      description: |
        Returns the current notice version, the derived current state per consent purpose (latest
        ledger entry wins; absent means never asked), and the append-only history. Account creation
        never grants any consent.
      responses:
        "200":
          description: Consent state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountConsents"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Suspended or deleted account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"
    post:
      operationId: recordAccountConsent
      tags: [account]
      summary: Grant or withdraw one purpose-specific consent
      description: |
        Appends one ledger entry for exactly one consent purpose. Entries are never edited or
        deleted. `noticeVersion` must match the current notice version served by
        `GET /account/consents` (400 VALIDATION_FAILED with `stale_notice_version` otherwise), so a
        user never agrees to text they have not seen. Requires a verified identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordAccountConsentInput"
      responses:
        "200":
          description: Consent state after the entry was appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountConsents"
        "400":
          description: Unknown field, unknown purpose, or stale notice version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Unverified, suspended, or deleted account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"

  /readiness:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Get the rollout readiness state of gated entry points
      description: Reports which gated feature areas are enabled for this deployment. Flags are read-only and set by the operator environment.
      responses:
        "200":
          description: Readiness flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureReadiness"

  /registration:
    get:
      operationId: getRegistration
      tags: [registration]
      summary: Get the signed-in user's registration profile
      responses:
        "200":
          description: Registration status and community participation access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStatus"
        "401":
          description: Authentication is required
    put:
      operationId: saveRegistration
      tags: [registration]
      summary: Create or update the signed-in user's registration profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "200":
          description: Saved registration profile and community participation access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStatus"
        "400":
          description: Invalid registration details
        "401":
          description: Authentication is required

  /weather:
    get:
      operationId: getWeather
      tags: [weather]
      summary: Get a short city weather forecast
      parameters:
        - name: cityId
          in: query
          required: true
          schema:
            type: string
          description: The city identifier (ams, rot, utr, dhg, ein)
      responses:
        "200":
          description: Current conditions and a three-day forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherResponse"
        "400":
          description: Unknown city
        "503":
          description: Weather provider temporarily unavailable

  /capture/search:
    post:
      operationId: captureSearch
      tags: [capture]
      summary: Search for businesses
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureSearchRequest"
      responses:
        "200":
          description: List of matching businesses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessListResult"

  /capture/scan:
    post:
      operationId: captureScan
      tags: [capture]
      summary: Scan a business for events, news, and ads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureScanRequest"
      responses:
        "200":
          description: Scan results (events, news, ads)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResultList"

  /capture/persist:
    post:
      operationId: capturePersist
      tags: [capture]
      summary: Persist selected scan results to the database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapturePersistRequest"
      responses:
        "200":
          description: Number of saved rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersistOutcome"

  /sources/scan:
    post:
      operationId: scanActivitySources
      tags: [source-scanning]
      summary: Deeply scan selected Den Haag sources for activity events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceScanRequest"
      responses:
        "200":
          description: Scan status and discovered event links per source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceScanResponse"
        "400":
          description: Invalid source selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceScanResponse"

  /sources/review:
    get:
      operationId: getEventReviewCandidates
      tags: [event-review]
      summary: Get excluded source-scanned event candidates for editorial review
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, open, rejected]
            default: all
          description: Whether to return open candidates, definitively rejected candidates, or both.
      responses:
        "200":
          description: Candidates that are not currently published in the public event list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventReviewList"

  /sources/review/{id}:
    patch:
      operationId: decideEventReviewCandidate
      tags: [event-review]
      summary: Approve a candidate with verified Hague event details or reject it definitively
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventReviewDecision"
      responses:
        "200":
          description: Updated editorial decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventReviewDecisionResult"
        "400":
          description: Invalid editorial decision
        "404":
          description: Candidate not found
        "409":
          description: Candidate has already received an editorial decision

  /listings:
    get:
      operationId: getListings
      tags: [listings]
      summary: Get local listings for a city
      description: Returns businesses, events, food-and-drink venues, or the curated Den Haag social map for a given city.
      parameters:
        - name: cityId
          in: query
          required: true
          schema:
            type: string
          description: The city identifier (ams, rot, utr, dhg, ein)
        - name: section
          in: query
          required: false
          schema:
            type: string
            enum: [events, businesses, food-drink, social-map]
            default: events
          description: Which Den Haag discovery stream to return.
        - name: language
          in: query
          required: true
          schema:
            type: string
            enum: [nl, en]
          description: Language selected by the user for all human-readable listing copy.
        - name: neighborhoods
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated neighborhood names used to target local business discovery.
        - name: businessCategories
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated business subcategories used to narrow provider retrieval before applying result limits.
        - name: searchLat
          in: query
          required: false
          schema:
            type: number
            format: double
          description: Center latitude for a selected neighborhood's targeted provider search.
        - name: searchLng
          in: query
          required: false
          schema:
            type: number
            format: double
          description: Center longitude for a selected neighborhood's targeted provider search.
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [live, stored_only]
            default: live
          description: Whether external providers may be queried or only previously stored external results may be used.
        - name: anonymousId
          in: query
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 100
          description: Stable browser identifier used to associate anonymous discovery requests without requiring sign-in.
      responses:
        "200":
          description: Listings result (live or fallback)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingsResponse"
        "400":
          description: Unknown city
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingsResponse"

  /saved-events:
    get:
      operationId: getSavedEvents
      tags: [saved-events]
      summary: Get the signed-in resident's saved events and alerts
      responses:
        "200":
          description: Saved event snapshots and change alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedEventsResponse"
        "401":
          description: Authentication is required

  /saved-events/sync:
    post:
      operationId: syncSavedEvents
      tags: [saved-events]
      summary: Merge saved event snapshots and alerts for the signed-in resident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedEventsSyncRequest"
      responses:
        "200":
          description: Updated saved event snapshots and alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedEventsResponse"
        "400":
          description: Invalid saved event sync payload
        "401":
          description: Authentication is required

  /listings/google-places-usage:
    get:
      operationId: getGooglePlacesUsage
      tags: [listings]
      summary: Get the permanent Google Places request allowance status
      responses:
        "200":
          description: Current request allowance status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GooglePlacesUsage"
        "401":
          description: Authentication is required
        "403":
          description: An editor role is required

  /listings/google-places-usage/reset:
    post:
      operationId: resetGooglePlacesUsage
      tags: [listings]
      summary: Manually reset the permanent Google Places request allowance
      responses:
        "200":
          description: Reset request allowance status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GooglePlacesUsage"
        "401":
          description: Authentication is required
        "403":
          description: An editor role is required

  /social-map/review:
    get:
      operationId: getSocialMapReview
      tags: [social-map-review]
      summary: Get the curated Den Haag social-map review queue
      description: Returns source status for every curated support location and the last successful public snapshot date.
      responses:
        "200":
          description: Social-map review status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialMapReviewResponse"
        "401":
          description: Authentication is required
        "403":
          description: An editor role is required
    post:
      operationId: runSocialMapReview
      tags: [social-map-review]
      summary: Run the periodic source review for curated support locations
      description: Checks official and verification pages. The public snapshot date changes only when every source check succeeds.
      responses:
        "200":
          description: Completed social-map review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialMapReviewResponse"
        "401":
          description: Authentication is required
        "403":
          description: An editor role is required
        "409":
          description: A review is already in progress
        "502":
          description: The review could not be completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required: [error]

  /news:
    get:
      operationId: getNews
      tags: [news]
      summary: Get published Den Haag news
      parameters:
        - name: subcategory
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NewsSubcategory"
      responses:
        "200":
          description: Published news feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsFeed"

  /news/{id}:
    get:
      operationId: getNewsArticle
      tags: [news]
      summary: Get one published news article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Published article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticle"
        "404":
          description: Article not found

  /news/sources/status:
    get:
      operationId: getNewsSourceStatuses
      tags: [news]
      summary: Get the latest scan status for approved news sources
      responses:
        "200":
          description: Latest scan status and retry time per approved source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsSourceStatusResponse"

  /news/scan:
    post:
      operationId: scanNewsSources
      tags: [news]
      summary: Crawl selected approved Den Haag news sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsScanRequest"
      responses:
        "200":
          description: Per-source news crawl results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsScanResponse"
        "400":
          description: Invalid source selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsScanResponse"

  /community-posts:
    get:
      operationId: getCommunityPosts
      tags: [community]
      summary: Get approved active community posts
      parameters:
        - name: cityId
          in: query
          required: true
          schema:
            type: string
        - name: neighborhood
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CommunityPostType"
      responses:
        "200":
          description: Active approved posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPostList"
        "400":
          description: Invalid city or post type
    post:
      operationId: createCommunityPost
      tags: [community]
      summary: Submit a community post for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPostInput"
      responses:
        "201":
          description: Submitted post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPostSubmission"
        "400":
          description: Invalid community post
        "401":
          description: Authentication is required
        "403":
          description: Registration is required to post

  /community-posts/moderation:
    get:
      operationId: getCommunityModerationPosts
      tags: [community]
      summary: Get the community moderation queue
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, all]
            default: pending
      responses:
        "200":
          description: Moderation queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPostList"
        "401":
          description: Authentication is required
        "403":
          description: An editor role is required

  /community-posts/moderation/{id}:
    patch:
      operationId: decideCommunityPost
      tags: [community]
      summary: Approve or reject a community post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPostDecision"
      responses:
        "200":
          description: Updated moderation item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPost"
        "400":
          description: Invalid moderation decision
        "401":
          description: Authentication is required
        "403":
          description: An editor role is required
        "404":
          description: Post not found

  /community-posts/{id}/participation:
    put:
      operationId: toggleCommunityPostParticipation
      tags: [community]
      summary: Add or remove the signed-in resident's interest or attendance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPostParticipationInput"
      responses:
        "200":
          description: Updated privacy-safe participation summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPostParticipationResponse"
        "400":
          description: Invalid participation action or attendance requested for a non-event post
        "401":
          description: Authentication is required
        "403":
          description: Registration is required to participate
        "404":
          description: Approved active post not found

  /business-claims:
    get:
      operationId: getMyBusinessClaims
      tags: [businesses]
      summary: Get the signed-in user's business claims
      responses:
        "200":
          description: Claims created by the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessClaimList"
        "401":
          description: Authentication is required
    post:
      operationId: createBusinessClaim
      tags: [businesses]
      summary: Submit a listing claim for editorial review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessClaimInput"
      responses:
        "201":
          description: Submitted claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessClaim"
        "400":
          description: Invalid claim
        "401":
          description: Authentication is required
        "409":
          description: A claim is already pending or the listing is claimed

  /business-claims/moderation:
    get:
      operationId: getBusinessClaimModeration
      tags: [businesses]
      summary: Get business-claim moderation items
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, all]
            default: pending
      responses:
        "200":
          description: Claim moderation queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessClaimList"
        "401":
          description: Authentication is required
        "403":
          description: An editor role is required

  /business-claims/moderation/{id}:
    patch:
      operationId: decideBusinessClaim
      tags: [businesses]
      summary: Approve or reject a business claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationDecision"
      responses:
        "200":
          description: Updated claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessClaim"
        "400":
          description: Invalid decision
        "401":
          description: Authentication is required
        "403":
          description: An editor role is required
        "404":
          description: Claim not found
        "409":
          description: Claim has already been decided

  /business-profiles/mine:
    get:
      operationId: getMyBusinessProfiles
      tags: [businesses]
      summary: Get profiles the signed-in user owns
      responses:
        "200":
          description: Owned business profiles and deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnedBusinessProfile"
        "401":
          description: Authentication is required

  /business-profiles/{id}:
    patch:
      operationId: updateBusinessProfile
      tags: [businesses]
      summary: Update an approved business profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessProfileUpdate"
      responses:
        "200":
          description: Updated business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessProfile"
        "400":
          description: Invalid update
        "401":
          description: Authentication is required
        "403":
          description: Owner access is required
        "404":
          description: Profile not found

  /business-profiles/{id}/deals:
    post:
      operationId: createBusinessDeal
      tags: [businesses]
      summary: Submit a deal for the owner's approved business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealInput"
      responses:
        "201":
          description: Submitted deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "400":
          description: Invalid deal
        "401":
          description: Authentication is required
        "403":
          description: Owner access is required
        "404":
          description: Profile not found

  /business-profiles/{id}/deals/{dealId}:
    patch:
      operationId: updateBusinessDeal
      tags: [businesses]
      summary: Update or withdraw an owned deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: dealId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealUpdate"
      responses:
        "200":
          description: Updated deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "400":
          description: Invalid update
        "401":
          description: Authentication is required
        "403":
          description: Owner access is required
        "404":
          description: Deal not found

  /business-profiles/public/{slug}:
    get:
      operationId: getBusinessProfile
      tags: [businesses]
      summary: Get one public claimed business profile
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public profile and active deals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBusinessProfile"
        "404":
          description: Claimed profile not found

  /deals:
    get:
      operationId: getDeals
      tags: [businesses]
      summary: Get active approved deals
      parameters:
        - name: cityId
          in: query
          required: true
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Active local deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deal"
        "400":
          description: Invalid city

  /deals/moderation:
    get:
      operationId: getDealModeration
      tags: [businesses]
      summary: Get deal moderation items
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, withdrawn, all]
            default: pending
      responses:
        "200":
          description: Deal moderation queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deal"
        "401":
          description: Authentication is required
        "403":
          description: An editor role is required

  /deals/moderation/{id}:
    patch:
      operationId: decideBusinessDeal
      tags: [businesses]
      summary: Approve or reject a submitted deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationDecision"
      responses:
        "200":
          description: Updated deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "400":
          description: Invalid decision
        "401":
          description: Authentication is required
        "403":
          description: An editor role is required
        "404":
          description: Deal not found
        "409":
          description: Deal has already been decided

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated key (8-128 characters) for mutating lifecycle operations. Replaying the same key
        with the same payload returns the original result; the same key with a different payload
        returns 409 IDEMPOTENCY_CONFLICT.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous PageInfo.nextCursor.
      schema:
        type: string
        maxLength: 200
    PageLimit:
      name: limit
      in: query
      required: false
      description: Page size for cursor-paginated lists.
      schema:
        type: number
        minimum: 1
        maximum: 50
        default: 20
  responses:
    VersionConflict:
      description: The expectedVersion or expectedRevision did not match the current server version. Reload and retry with the returned expectedVersion.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    FeatureDisabled:
      description: This entry point is disabled until its readiness gate is met.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ClaimStatus:
      type: string
      description: |
        Claim lifecycle. `pending` is the legacy alias of `submitted` (awaiting review).
        Open states that hold the one-open-claim-per-listing slot: pending, submitted,
        changes_requested, disputed. Transitions: pending|submitted -> approved | rejected |
        changes_requested | withdrawn; changes_requested -> submitted | withdrawn;
        approved -> disputed; disputed -> approved | rejected.
      enum: [pending, submitted, changes_requested, approved, rejected, disputed, withdrawn]

    ClaimNextAction:
      type: string
      description: What the claimant can do next; derived server-side from the claim status.
      enum: [wait_for_review, provide_changes, none]

    PublicationStatus:
      type: string
      description: |
        Business publication lifecycle. Existing profiles are `published`.
        draft -> published (explicit reviewer publication); published <-> unpublished;
        published -> suspended (reviewer); any -> archived (terminal). Only `published`
        profiles and their deals are served on public routes.
      enum: [draft, unpublished, published, suspended, archived]

    ApiError:
      type: object
      description: |
        Stable, safe error shape for account and lifecycle operations. `code` is machine-readable,
        `messageKey` maps to a localized message on the client, and `correlationId` matches the
        server log entry. Never contains personal data or provider details. Existing operations
        keep their `{ error }` string responses for compatibility.
      required: [code, messageKey, correlationId]
      properties:
        code:
          $ref: "#/components/schemas/ApiErrorCode"
        messageKey:
          type: string
          description: Localization key, e.g. `errors.auth_required`.
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/ApiFieldError"
        correlationId:
          type: string
        expectedVersion:
          type: number
          description: Present on VERSION_CONFLICT responses; the current server version the client must reload before retrying.

    ApiErrorCode:
      type: string
      enum:
        - AUTH_REQUIRED
        - EMAIL_UNVERIFIED
        - ACCOUNT_SUSPENDED
        - ACCOUNT_DELETED
        - FORBIDDEN
        - SELF_REVIEW_FORBIDDEN
        - NOT_FOUND
        - FEATURE_DISABLED
        - VALIDATION_FAILED
        - UNKNOWN_FIELD
        - VERSION_CONFLICT
        - IDEMPOTENCY_CONFLICT
        - RATE_LIMITED
        - PROVISIONING_UNAVAILABLE
        - DEPENDENCY_UNAVAILABLE

    ApiFieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
          description: Machine-readable per-field reason, e.g. `required`, `unknown`, `not_in_controlled_list`.

    PageInfo:
      type: object
      description: Cursor pagination envelope shared by list operations added after this contract version.
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: ["string", "null"]
        hasMore:
          type: boolean

    FeatureReadiness:
      type: object
      description: Read-only rollout flags; each entry point stays disabled (404) until its gate is met.
      required: [accounts, businessIntake, businessPublication]
      properties:
        accounts:
          type: boolean
        businessIntake:
          type: boolean
        businessPublication:
          type: boolean

    AccountStatus:
      type: string
      description: |
        Persisted account state, changed only server-side: active <-> suspended (operator),
        active|suspended -> deleted (approved deletion request; terminal). Email verification is
        not an account state; it is derived from the identity provider per request.
      enum: [active, suspended, deleted]

    AccountLocale:
      type: string
      enum: [nl, en]

    AccountRole:
      type: string
      description: The single highest server-derived role for the current request.
      enum: [unverified, user, business_member, reviewer]

    AccountCapabilities:
      type: object
      description: Server-derived capabilities. Clients must never send these; they are recomputed on every request.
      required: [isVerified, isEditor, isBusinessMember, canClaimBusiness, canPublishBusiness, canReview]
      properties:
        isVerified:
          type: boolean
          description: The identity provider reports a verified primary email for this session.
        isEditor:
          type: boolean
          description: The session carries the trusted editor or admin role claim.
        isBusinessMember:
          type: boolean
          description: The user has at least one business membership.
        canClaimBusiness:
          type: boolean
          description: Verified, active, and the business intake gate is on.
        canPublishBusiness:
          type: boolean
          description: Editor and the business publication gate is on.
        canReview:
          type: boolean
          description: Editor; self-review of the user's own businesses or claims is still refused per request.

    AccountMe:
      type: object
      description: Private account summary for the signed-in user only. Never served on public routes.
      required:
        - id
        - status
        - role
        - locale
        - onboardingCompleted
        - capabilities
        - hasResearchRegistration
        - businessMembershipCount
        - preferences
        - createdAt
      properties:
        id:
          type: number
          description: Local account id (never the identity-provider subject).
        status:
          $ref: "#/components/schemas/AccountStatus"
        role:
          $ref: "#/components/schemas/AccountRole"
        locale:
          $ref: "#/components/schemas/AccountLocale"
        onboardingCompleted:
          type: boolean
        onboardingCompletedAt:
          type: ["string", "null"]
        capabilities:
          $ref: "#/components/schemas/AccountCapabilities"
        hasResearchRegistration:
          type: boolean
          description: Whether the separate campaign-style research registration exists. Never merged into account data.
        businessMembershipCount:
          type: number
        preferences:
          oneOf:
            - $ref: "#/components/schemas/ConsumerPreferences"
            - type: "null"
        createdAt:
          type: string

    ConsumerPreferences:
      type: object
      description: Optional controlled preferences owned by exactly one account. Updates require expectedRevision and return 409 VERSION_CONFLICT on mismatch.
      required: [revision, neighborhoodIds, interestIds, updatedAt]
      properties:
        revision:
          type: number
        neighborhoodIds:
          type: array
          maxItems: 20
          items:
            type: string
        interestIds:
          type: array
          maxItems: 20
          items:
            type: string
        updatedAt:
          type: string

    ConsentPurpose:
      type: string
      description: |
        Purpose-specific consents that are asked separately from account creation and from
        the research registration. `marketing_updates`: occasional product and neighbourhood
        updates by e-mail. `research_contact`: may be contacted about product research.
      enum: [marketing_updates, research_contact]

    UpdateAccountPreferencesInput:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: number
          minimum: 0
          description: Current stored revision, or 0 when no preferences exist yet.
        locale:
          $ref: "#/components/schemas/AccountLocale"
        neighborhoodIds:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 120
        interestIds:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 120

    RecordAccountConsentInput:
      type: object
      additionalProperties: false
      required: [consentType, noticeVersion, granted, source]
      properties:
        consentType:
          $ref: "#/components/schemas/ConsentPurpose"
        noticeVersion:
          type: string
          maxLength: 80
        granted:
          type: boolean
        source:
          type: string
          description: Where the user made the choice; support and system entries are never accepted from clients.
          enum: [onboarding, account_settings]

    ConsentState:
      type: object
      required: [consentType, granted, noticeVersion, recordedAt]
      properties:
        consentType:
          $ref: "#/components/schemas/ConsentPurpose"
        granted:
          type: boolean
        noticeVersion:
          type: string
        recordedAt:
          type: string

    AccountConsents:
      type: object
      required: [currentNoticeVersion, purposes, current, history]
      properties:
        currentNoticeVersion:
          type: string
          description: Version of the consent notice text the client must show before recording a choice.
        purposes:
          type: array
          description: All purposes that can be asked; a purpose without a current entry has never been asked.
          items:
            $ref: "#/components/schemas/ConsentPurpose"
        current:
          type: array
          items:
            $ref: "#/components/schemas/ConsentState"
        history:
          type: array
          items:
            $ref: "#/components/schemas/ConsentEvent"

    ConsentEvent:
      type: object
      description: One append-only consent ledger entry. Entries are never edited; the latest entry per consentType is the current state.
      required: [id, consentType, noticeVersion, granted, source, createdAt]
      properties:
        id:
          type: number
        consentType:
          type: string
        noticeVersion:
          type: string
        granted:
          type: boolean
        source:
          type: string
          enum: [onboarding, account_settings, support, system]
        createdAt:
          type: string

    AccountOption:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: object
          required: [nl, en]
          properties:
            nl:
              type: string
            en:
              type: string

    AccountOptions:
      type: object
      required: [neighborhoods, interests, taxonomyVersion]
      properties:
        taxonomyVersion:
          type: string
          description: Identifier of the controlled list version; stored IDs that no longer resolve are shown as no longer available, never dropped.
        neighborhoods:
          type: array
          items:
            $ref: "#/components/schemas/AccountOption"
        interests:
          type: array
          items:
            $ref: "#/components/schemas/AccountOption"

    BusinessRevisionStatus:
      type: string
      description: |
        draft -> submitted (owner); submitted -> approved | changes_requested | rejected (reviewer);
        changes_requested -> submitted (owner, new version); approved -> superseded (later approval);
        draft -> discarded (owner). A business has at most one approved revision.
      enum: [draft, submitted, changes_requested, approved, rejected, superseded, discarded]

    BusinessRevisionSummary:
      type: object
      description: Owner- and reviewer-visible revision metadata. Draft content is never served on public routes.
      required: [id, businessProfileId, version, status, createdAt, updatedAt]
      properties:
        id:
          type: number
        businessProfileId:
          type: number
        version:
          type: number
        status:
          $ref: "#/components/schemas/BusinessRevisionStatus"
        submittedAt:
          type: ["string", "null"]
        decidedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    ReviewDecisionRecord:
      type: object
      description: Immutable audit entry for a reviewer decision. The reviewer is derived from the session and must not own the target (self-review is refused with SELF_REVIEW_FORBIDDEN).
      required: [id, targetType, targetId, targetVersion, decision, createdAt]
      properties:
        id:
          type: number
        targetType:
          type: string
          enum: [claim, revision, publication]
        targetId:
          type: number
        targetVersion:
          type: number
        decision:
          type: string
          enum: [approve, reject, request_changes, publish, unpublish, suspend]
        reasonCode:
          type: ["string", "null"]
        reason:
          type: ["string", "null"]
        createdAt:
          type: string

    AccountRequestStatus:
      type: string
      description: |
        received -> blocked | in_review | withdrawn; blocked -> received | withdrawn;
        in_review -> completed | rejected. Deletion requests are blocked while the user is the
        sole owner of a published business.
      enum: [received, blocked, in_review, completed, rejected, withdrawn]

    AccountRequest:
      type: object
      description: Private to the requesting account.
      required: [id, scope, type, status, version, createdAt, updatedAt]
      properties:
        id:
          type: number
        scope:
          type: string
          enum: [account, business]
        type:
          type: string
          enum: [deletion, export, suspension_appeal]
        status:
          $ref: "#/components/schemas/AccountRequestStatus"
        version:
          type: number
        deadlineAt:
          type: ["string", "null"]
        blockerCode:
          type: ["string", "null"]
        resolutionCode:
          type: ["string", "null"]
        resolvedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    LifecycleMessageStatus:
      type: string
      description: |
        Outbox state of a lifecycle message, distinct from the business or account state it describes.
        queued -> sending -> sent | failed; sending -> queued on transient failure with a retry time;
        queued -> cancelled when the triggering state is reverted. Without a configured provider
        messages stay queued and the UI may only say "message pending".
      enum: [queued, sending, sent, failed, cancelled]

    DealStatus:
      type: string
      enum: [pending, approved, rejected, withdrawn]

    BusinessListingReference:
      type: object
      required: [cityId, listingId, listingSource, name]
      properties:
        cityId:
          type: string
          minLength: 1
        listingId:
          type: string
          minLength: 1
        listingSource:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 160
        address:
          type: string
          maxLength: 240
        neighborhood:
          type: string
          maxLength: 120
        latitude:
          type: number
        longitude:
          type: number
        sourceUrl:
          type: string

    BusinessProfile:
      type: object
      required: [id, slug, cityId, name, isClaimed, createdAt, updatedAt]
      properties:
        id:
          type: number
        slug:
          type: string
        cityId:
          type: string
        name:
          type: string
        address:
          type: ["string", "null"]
        neighborhood:
          type: ["string", "null"]
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        sourceUrl:
          type: ["string", "null"]
        tagline:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        openingHours:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        coverUrl:
          type: ["string", "null"]
        isClaimed:
          type: boolean
        claimedAt:
          type: ["string", "null"]
        publicationStatus:
          $ref: "#/components/schemas/PublicationStatus"
        approvedRevisionVersion:
          type: ["number", "null"]
          description: Version of the approved revision when publication review is enabled; null when the profile is served from its columns.
        createdAt:
          type: string
        updatedAt:
          type: string

    BusinessClaim:
      type: object
      required: [id, businessProfileId, claimantId, contactName, contactEmail, relationship, status, createdAt, updatedAt, profile]
      properties:
        id:
          type: number
        businessProfileId:
          type: number
        claimantId:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
        relationship:
          type: string
        evidenceUrl:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/ClaimStatus"
        reviewNote:
          type: ["string", "null"]
        reviewedAt:
          type: ["string", "null"]
        version:
          type: number
          description: Optimistic-concurrency version; send it back as expectedVersion on later claim updates.
        nextAction:
          $ref: "#/components/schemas/ClaimNextAction"
        createdAt:
          type: string
        updatedAt:
          type: string
        profile:
          $ref: "#/components/schemas/BusinessProfile"

    BusinessClaimList:
      type: array
      items:
        $ref: "#/components/schemas/BusinessClaim"

    BusinessClaimInput:
      type: object
      required: [listing, contactName, contactEmail, relationship]
      properties:
        listing:
          $ref: "#/components/schemas/BusinessListingReference"
        contactName:
          type: string
          minLength: 2
          maxLength: 120
        contactEmail:
          type: string
        relationship:
          type: string
          minLength: 2
          maxLength: 120
        evidenceUrl:
          type: string
        message:
          type: string
          maxLength: 1200

    BusinessProfileUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        tagline:
          type: string
          maxLength: 160
        description:
          type: string
          maxLength: 2400
        websiteUrl:
          type: string
        phone:
          type: string
          maxLength: 50
        email:
          type: string
        openingHours:
          type: string
          maxLength: 600
        logoUrl:
          type: string
        coverUrl:
          type: string

    Deal:
      type: object
      required: [id, businessProfileId, cityId, title, description, category, offerText, validFrom, validUntil, status, createdAt, updatedAt]
      properties:
        id:
          type: number
        businessProfileId:
          type: number
        businessName:
          type: string
        businessSlug:
          type: string
        cityId:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        offerText:
          type: string
        redemptionUrl:
          type: ["string", "null"]
        couponCode:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        validFrom:
          type: string
        validUntil:
          type: string
        status:
          $ref: "#/components/schemas/DealStatus"
        reviewNote:
          type: ["string", "null"]
        reviewedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    DealInput:
      type: object
      required: [title, description, category, offerText, validFrom, validUntil]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 140
        description:
          type: string
          minLength: 10
          maxLength: 1200
        category:
          type: string
          minLength: 2
          maxLength: 80
        offerText:
          type: string
          minLength: 2
          maxLength: 140
        redemptionUrl:
          type: string
        couponCode:
          type: string
          maxLength: 80
        imageUrl:
          type: string
        validFrom:
          type: string
          format: date
        validUntil:
          type: string
          format: date

    DealUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 140
        description:
          type: string
          minLength: 10
          maxLength: 1200
        category:
          type: string
          minLength: 2
          maxLength: 80
        offerText:
          type: string
          minLength: 2
          maxLength: 140
        redemptionUrl:
          type: string
        couponCode:
          type: string
          maxLength: 80
        imageUrl:
          type: string
        validFrom:
          type: string
          format: date
