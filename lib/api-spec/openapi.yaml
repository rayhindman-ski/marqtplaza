          type: string
          enum: [missing_date, out_of_window, missing_locality, foreign_location]
      required: [title, url]

    SourceScanResult:
      type: object
      properties:
        sourceId:
          type: string
        sourceName:
          type: string
        scannedUrl:
          type: string
        status:
          type: string
          enum: [found, partial, no_events, blocked, error]
        events:
          type: array
          items:
            $ref: "#/components/schemas/SourceScanEvent"
        eventLinksRead:
          type: number
          minimum: 0
          description: Number of same-source links examined across approved index and detail pages.
        eventsCaptured:
          type: number
          minimum: 0
          description: Number of unique event links captured from the source page.
        eventsEligible:
          type: number
          minimum: 0
          description: Captured events with a verified upcoming date and Den Haag evidence that are eligible for publication.
        eventsMissingDate:
          type: number
          minimum: 0
          description: Captured events excluded because no explicit event date could be parsed.
        eventsOutOfWindow:
          type: number
          minimum: 0
          description: Captured events excluded because their date is past or more than 18 months away.
        eventsMissingLocality:
          type: number
          minimum: 0
          description: Captured events excluded because no Den Haag location evidence was found.
        eventsForeignLocation:
          type: number
          minimum: 0
          description: Captured events excluded because available evidence establishes a location outside the Netherlands.
        pagesRead:
          type: number
          minimum: 0
          description: Number of approved source pages read during the bounded crawl.
        pagesFailed:
          type: number
          minimum: 0
          description: Number of approved source pages that could not be read.
        pagesSkipped:
          type: number
          minimum: 0
          description: Discovered pages skipped because a safe crawl budget was reached.
        indexPagesRead:
          type: number
          minimum: 0
          description: Calendar, archive, or pagination pages read during the crawl.
        detailPagesRead:
          type: number
          minimum: 0
          description: Candidate event detail pages read during the crawl.
        sitemapsRead:
          type: number
          minimum: 0
          description: Approved sitemap pages read during the crawl.
        robotsPagesSkipped:
          type: number
          minimum: 0
          description: Discovered same-origin pages skipped because the source's robots.txt policy disallows them for this crawler.
        crawlLimitReached:
          type: boolean
          description: Whether one or more safe per-source crawl limits truncated further discovery.
        eventsAdded:
          type: number
          minimum: 0
          description: Number of newly persisted events added to the Den Haag activity list.
        eventsUpdated:
          type: number
          minimum: 0
          description: Number of previously discovered events refreshed by this scan.
        eventsSkipped:
          type: number
          minimum: 0
          description: Captured events excluded from public listings because they did not meet publication checks.
        message:
          type: string
      required: [sourceId, sourceName, scannedUrl, status, events, eventLinksRead, eventsCaptured, eventsEligible, eventsMissingDate, eventsOutOfWindow, eventsMissingLocality, eventsForeignLocation, pagesRead, pagesFailed, pagesSkipped, indexPagesRead, detailPagesRead, sitemapsRead, robotsPagesSkipped, crawlLimitReached, eventsAdded, eventsUpdated, eventsSkipped]

