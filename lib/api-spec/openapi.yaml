      description: Returns businesses, events, food-and-drink venues, or the curated Den Haag social map for a given city.
      parameters:
        - name: cityId
          in: query
          required: true
          schema:
            type: string
          description: The city identifier (ams, rot, utr, dhg, ein)
        - name: section
          in: query
          required: false
          schema:
            type: string
            enum: [events, businesses, food-drink, social-map]
            default: events
          description: Which Den Haag discovery stream to return.
        - name: language
          in: query
          required: true
          schema:
            type: string
            enum: [nl, en]
          description: Language selected by the user for all human-readable listing copy.
        - name: neighborhoods
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated neighborhood names used to target local business discovery.
        - name: businessCategories
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated business subcategories used to narrow provider retrieval before applying result limits.
        - name: searchLat
          in: query
          required: false
          schema:
            type: number
            format: double
          description: Center latitude for a selected neighborhood's targeted provider search.
        - name: searchLng
          in: query
          required: false
          schema:
            type: number
            format: double
          description: Center longitude for a selected neighborhood's targeted provider search.
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [live, stored_only]
            default: live
          description: Whether external providers may be queried or only previously stored external results may be used.
        - name: anonymousId
          in: query
