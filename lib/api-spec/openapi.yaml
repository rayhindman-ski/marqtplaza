                $ref: "#/components/schemas/PublicBusinessProfile"
        "404":
          description: Claimed profile not found

  /business-profiles/{id}/revision:
    get:
      operationId: getBusinessRevisionWorkspace
      tags: [business-publication]
      summary: Owner view of the profile's editorial state
      description: |
        Returns the latest revision (draft, submitted, or changes requested), the currently
        approved revision, the last safe reviewer decision, fact-check freshness, and the derived
        owner state. Requires a membership on the business and the `businessPublication` gate.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Editorial workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessRevisionWorkspace"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found, not a member, or the publication gate is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateBusinessRevision
      tags: [business-publication]
      summary: Save bilingual draft changes as a revision
      description: |
        Merges the given NL/EN text and language-neutral facts into the owner's draft. When the
        latest revision is a `draft` it is edited in place; otherwise a new draft version is created
        from the latest revision's content. `expectedVersion` must equal the latest revision's
        `version` (0 when the business has no revision yet); a mismatch returns 409
        VERSION_CONFLICT. A `submitted` revision cannot be edited (409 with field `status`). The
        approved snapshot is never mutated here.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessRevisionUpdateInput"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessRevisionWorkspace"
        "400":
          description: Invalid input or unknown field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Unverified account or not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found or the publication gate is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          $ref: "#/components/responses/VersionConflict"

  /business-profiles/{id}/revision/submit:
    post:
      operationId: submitBusinessRevision
      tags: [business-publication]
      summary: Submit the current draft for editorial review
      description: |
        Moves the latest `draft` revision to `submitted`. Content becomes immutable from this point;
        reviewers decide exactly this version. Requires at least one non-empty Dutch or English
        text field. `expectedVersion` must equal the draft's `version`.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessRevisionTransitionInput"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessRevisionWorkspace"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Unverified account or not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found or the publication gate is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          $ref: "#/components/responses/VersionConflict"

  /business-profiles/{id}/revision/discard:
    post:
      operationId: discardBusinessRevision
      tags: [business-publication]
      summary: Discard the current draft
      description: Marks the latest `draft` revision `discarded`. Submitted and decided revisions are kept as history.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessRevisionTransitionInput"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessRevisionWorkspace"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found or the publication gate is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          $ref: "#/components/responses/VersionConflict"

  /review/claims:
    get:
      operationId: getAuthorityQueue
      tags: [business-publication]
      summary: Paginated authority (ownership) review queue
      description: |
        Claims awaiting an authority decision (`pending`, `submitted`, `disputed`), oldest first.
        Items carry the relationship and authority evidence needed to decide, never the
        claimant's e-mail address. `canDecide` is false when the reviewer is the claimant, the
        creator, or a member of the business.
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Queue page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityQueuePage"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Reviewer role is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"

  /review/claims/{id}/decision:
    post:
      operationId: reviewBusinessClaim
      tags: [business-publication]
      summary: Decide an authority claim at an exact version
      description: |
        Approve grants exactly one owner membership atomically and rejects competing open claims;
        `reject` and `request_changes` require a reason that the claimant will see. The decision is
        applied only when the claim still has `expectedVersion` and a reviewable status (409
        VERSION_CONFLICT otherwise). Self-review returns 403 SELF_REVIEW_FORBIDDEN.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewClaimDecisionInput"
      responses:
        "200":
          description: Decided claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessClaim"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Reviewer role required or self-review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Claim not found or the publication gate is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          $ref: "#/components/responses/VersionConflict"

  /review/revisions:
    get:
      operationId: getEditorialQueue
      tags: [business-publication]
      summary: Paginated editorial (profile revision) review queue
      description: Submitted revisions oldest first, each with the currently approved revision for comparison.
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Queue page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialQueuePage"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Reviewer role is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"

  /review/revisions/{id}/decision:
    post:
      operationId: reviewBusinessRevision
      tags: [business-publication]
      summary: Decide a submitted revision at an exact version
      description: |
        `approve` atomically makes this revision the business's approved snapshot (the previous
        approved revision becomes `superseded`) and records the supplied fact checks; fields marked
        `contradicted` are withheld from the public projection. `reject` and `request_changes`
        require a reason. Applied only while the revision is `submitted` with exactly
        `expectedVersion` (409 otherwise). Approval never publishes by itself.
      parameters:
        - $ref: "#/components/parameters/RevisionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRevisionDecisionInput"
      responses:
        "200":
          description: Decided revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialQueueItem"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Reviewer role required or self-review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Revision not found or the publication gate is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          $ref: "#/components/responses/VersionConflict"

  /review/businesses:
    get:
      operationId: getPublicationQueue
      tags: [business-publication]
      summary: Paginated publication overview
      description: |
        Businesses that have an approved revision or a non-default publication status, newest change first.
        With `recheckDue=true` the page only contains businesses whose confirmed fact checks are inside the
        re-check window (`freshness.recheckDue`), ordered by `freshness.staleOn` ascending so the soonest
        expiring facts come first. Cursors are specific to the ordering they were issued for.
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
        - name: recheckDue
          in: query
          required: false
          description: When true, restrict to businesses whose fact re-check is due and order by soonest staleOn.
          schema:
            type: boolean
      responses:
        "200":
          description: Queue page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationQueuePage"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Reviewer role is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/FeatureDisabled"

  /review/businesses/{id}/publication:
    post:
      operationId: setBusinessPublication
      tags: [business-publication]
      summary: Publish, unpublish, or suspend a business
      description: |
        `publish` requires an approved revision and moves `draft`/`unpublished` to `published`;
        `unpublish` and `suspend` require a reason and keep the approved snapshot so a later
        `publish` restores exactly it. `expectedRevisionVersion` must equal the approved
        revision's version (409 otherwise), so a reviewer never publishes a snapshot they did not
        see. Every action is recorded as an immutable review entry.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationActionInput"
      responses:
        "200":
          description: Updated publication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationQueueItem"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Reviewer role required or self-review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Business not found or the publication gate is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          $ref: "#/components/responses/VersionConflict"

  /deals:
    get:
      operationId: getDeals
      tags: [businesses]
      summary: Get active approved deals
      parameters:
        - name: cityId
          in: query
          required: true
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Active local deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deal"
        "400":
          description: Invalid city

  /deals/moderation:
    get:
      operationId: getDealModeration
      tags: [businesses]
      summary: Get deal moderation items
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, withdrawn, all]
            default: pending
      responses:
        "200":
          description: Deal moderation queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deal"
        "401":
          description: Authentication is required
        "403":
          description: An editor role is required

  /deals/moderation/{id}:
    patch:
      operationId: decideBusinessDeal
      tags: [businesses]
      summary: Approve or reject a submitted deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationDecision"
      responses:
        "200":
          description: Updated deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "400":
          description: Invalid decision
        "401":
          description: Authentication is required
        "403":
          description: An editor role is required
        "404":
          description: Deal not found
        "409":
          description: Deal has already been decided

components:
  parameters:
    ClaimId:
      name: id
      in: path
      required: true
      schema:
        type: number
    ProfileId:
      name: id
      in: path
      required: true
      schema:
        type: number
    RevisionId:
      name: id
      in: path
      required: true
      schema:
        type: number
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated key (8-128 characters) for mutating lifecycle operations. Replaying the same key
        with the same payload returns the original result; the same key with a different payload
        returns 409 IDEMPOTENCY_CONFLICT.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous PageInfo.nextCursor.
      schema:
        type: string
        maxLength: 200
    PageLimit:
      name: limit
      in: query
      required: false
      description: Page size for cursor-paginated lists.
      schema:
        type: number
        minimum: 1
        maximum: 50
        default: 20
    AccountRequestId:
      name: id
      in: path
      required: true
      schema:
        type: number
    LifecycleMessageId:
      name: id
      in: path
      required: true
      schema:
        type: number
  responses:
    VersionConflict:
      description: The expectedVersion or expectedRevision did not match the current server version. Reload and retry with the returned expectedVersion.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    FeatureDisabled:
      description: This entry point is disabled until its readiness gate is met.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ClaimStatus:
      type: string
      description: |
        Claim lifecycle. `pending` is the legacy alias of `submitted` (awaiting review).
        Open states that hold the one-open-claim-per-listing slot: pending, submitted,
        changes_requested, disputed. Transitions: pending|submitted -> approved | rejected |
        changes_requested | withdrawn; changes_requested -> submitted | withdrawn;
        approved -> disputed; disputed -> approved | rejected.
      enum: [draft, pending, submitted, changes_requested, approved, rejected, disputed, withdrawn]

    ClaimNextAction:
      type: string
      description: What the claimant can do next; derived server-side from the claim status. `submit` applies to private drafts, `provide_changes` after a reviewer asked for changes.
      enum: [submit, wait_for_review, provide_changes, none]

    BusinessIntakeKind:
      type: string
      description: Whether a claim targets a current public listing or a new business that is not listed yet.
      enum: [existing_listing, new_business]

    BusinessLookupMatch:
      type: object
      description: Public-only business match. Never contains contact details, claimant data, or pending-claim details.
      required: [kind, cityId, listingSource, listingId, name, isClaimed]
      properties:
        kind:
          type: string
          enum: [listing, profile]
          description: "`listing` comes from the current public listing source; `profile` is a business already known to Buurtplaza."
        cityId:
          type: string
        listingSource:
          type: string
        listingId:
          type: string
        name:
          type: string
        neighborhood:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        sourceUrl:
          type: ["string", "null"]
        isClaimed:
          type: boolean
          description: A verified representative already manages this business; a new claim would be recorded as disputed.

    BusinessLookupResponse:
      type: object
      required: [query, matches, truncated]
      properties:
        query:
          type: string
        matches:
          type: array
          items:
            $ref: "#/components/schemas/BusinessLookupMatch"
        truncated:
          type: boolean
          description: More matches exist than the bounded result set; refine the query.

    NewBusinessFacts:
      type: object
      description: Public facts for a business that is not listed yet. Stored privately until publication review.
      required: [name, category, neighborhood]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        category:
          type: string
          minLength: 2
          maxLength: 80
        neighborhood:
          type: string
          minLength: 2
          maxLength: 120
        address:
          type: string
          maxLength: 240
        websiteUrl:
          type: string
          maxLength: 400

    BusinessIntakeDraftInput:
      type: object
      required: [kind, contactName, contactEmail, relationship, authorityDeclaration]
      properties:
        kind:
          $ref: "#/components/schemas/BusinessIntakeKind"
        listing:
          type: object
          description: "Required for `existing_listing`; resolved server-side, never trusted for facts."
          required: [cityId, listingSource, listingId]
          properties:
            cityId:
              type: string
              minLength: 1
            listingSource:
              type: string
              minLength: 1
            listingId:
              type: string
              minLength: 1
        business:
          $ref: "#/components/schemas/NewBusinessFacts"
        contactName:
          type: string
          minLength: 2
          maxLength: 120
        contactEmail:
          type: string
          minLength: 3
          maxLength: 254
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
        relationship:
          type: string
          minLength: 2
          maxLength: 120
        authorityDeclaration:
          type: string
          minLength: 10
          maxLength: 1200
          description: The representative's own statement of their authority over the business (private).
        evidenceReference:
          type: string
          maxLength: 400
          description: Optional URL or short text reference supporting the declaration (private). No uploads.
        message:
          type: string
          maxLength: 1200

    BusinessClaimUpdateInput:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: number
        contactName:
          type: string
          minLength: 2
          maxLength: 120
        contactEmail:
          type: string
          minLength: 3
          maxLength: 254
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
        relationship:
          type: string
          minLength: 2
          maxLength: 120
        authorityDeclaration:
          type: string
          minLength: 10
          maxLength: 1200
        evidenceReference:
          type: ["string", "null"]
          maxLength: 400
        message:
          type: ["string", "null"]
          maxLength: 1200
        business:
          $ref: "#/components/schemas/NewBusinessFacts"

    BusinessClaimTransitionInput:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: number
        confirmNoDuplicate:
          type: boolean
          description: |
            Only meaningful when submitting a `new_business` draft. Submission re-checks public
            listings and published profiles for equivalent businesses; when candidates exist and
            this flag is not `true`, the server answers 409 `DUPLICATE_CANDIDATES` with the
            candidates so the representative can claim one instead or explicitly confirm.

    PublicationStatus:
      type: string
      description: |
        Business publication lifecycle. Existing profiles are `published`.
        draft -> published (explicit reviewer publication); published <-> unpublished;
        published -> suspended (reviewer); any -> archived (terminal). Only `published`
        profiles and their deals are served on public routes.
      enum: [draft, unpublished, published, suspended, archived]

    ApiError:
      type: object
      description: |
        Stable, safe error shape for account and lifecycle operations. `code` is machine-readable,
        `messageKey` maps to a localized message on the client, and `correlationId` matches the
        server log entry. Never contains personal data or provider details. Existing operations
        keep their `{ error }` string responses for compatibility.
      required: [code, messageKey, correlationId]
      properties:
        code:
          $ref: "#/components/schemas/ApiErrorCode"
        messageKey:
          type: string
          description: Localization key, e.g. `errors.auth_required`.
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/ApiFieldError"
        correlationId:
          type: string
        expectedVersion:
          type: number
          description: Present on VERSION_CONFLICT responses; the current server version the client must reload before retrying.
        duplicateCandidates:
          type: array
          description: Present on DUPLICATE_CANDIDATES responses; public matches that may already represent the submitted new business.
          items:
            $ref: "#/components/schemas/BusinessLookupMatch"

    ApiErrorCode:
      type: string
      enum:
        - AUTH_REQUIRED
        - EMAIL_UNVERIFIED
        - ACCOUNT_SUSPENDED
        - ACCOUNT_DELETED
        - FORBIDDEN
        - SELF_REVIEW_FORBIDDEN
        - NOT_FOUND
        - FEATURE_DISABLED
        - VALIDATION_FAILED
        - UNKNOWN_FIELD
        - VERSION_CONFLICT
        - IDEMPOTENCY_CONFLICT
        - DUPLICATE_CANDIDATES
        - RATE_LIMITED
        - PROVISIONING_UNAVAILABLE
        - DEPENDENCY_UNAVAILABLE

    ApiFieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
          description: Machine-readable per-field reason, e.g. `required`, `unknown`, `not_in_controlled_list`.

    PageInfo:
      type: object
      description: Cursor pagination envelope shared by list operations added after this contract version.
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: ["string", "null"]
        hasMore:
          type: boolean

    FeatureReadiness:
      type: object
      description: Read-only rollout flags; each entry point stays disabled (404) until its gate is met.
      required: [accounts, businessIntake, businessPublication, consumerRegistration]
      properties:
        accounts:
          type: boolean
        businessIntake:
          type: boolean
        businessPublication:
          type: boolean
        consumerRegistration:
          type: boolean

    ConsumerRegistrationRequestInput:
      type: object
      additionalProperties: false
      required: [name, email, phone, locale]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Validated server-side with a conservative pattern; normalization never merges distinct addresses.
        phone:
          type: string
          minLength: 6
          maxLength: 32
          description: Contact data only (REG-005). Country-aware normalization; not an SMS sign-in factor.
        locale:
          $ref: "#/components/schemas/AccountLocale"
        returnRef:
          type: string
          maxLength: 512
          description: Opaque internal return reference; must match the allow-list or it is dropped.

    ConsumerRegistrationResendInput:
      type: object
      additionalProperties: false
      required: [email, locale]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        locale:
          $ref: "#/components/schemas/AccountLocale"

    ConsumerRegistrationVerifyInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128

    ConsumerRegistrationAccepted:
      type: object
      description: Neutral acknowledgement. Identical for new, pending, and existing-account addresses.
      required: [status, linkLifetimeMinutes]
      properties:
        status:
          type: string
          enum: [accepted]
        linkLifetimeMinutes:
          type: number
          description: Policy link lifetime, shown so the consumer knows how long to look for the email.

    ConsumerRegistrationLinkStatus:
      type: string
      description: |
        Explicit link states (REG-015). `valid` on GET means the link may be consumed; on POST it means
        the handoff was reached. `unavailable` is reported by the API as 503, never as a state.
      enum: [valid, expired, used, superseded, invalid]

    ConsumerRegistrationLinkState:
      type: object
      required: [state, canResend]
      properties:
        state:
          $ref: "#/components/schemas/ConsumerRegistrationLinkStatus"
        canResend:
          type: boolean
          description: Whether the resend journey applies to this state.
        locale:
          $ref: "#/components/schemas/AccountLocale"
        expiresAt:
          type: string
          format: date-time
          description: Only for `valid`; when the link stops working.

    AccountStatus:
      type: string
      description: |
        Persisted account state, changed only server-side: active <-> suspended (operator),
        active|suspended -> deleted (approved deletion request; terminal). Email verification is
        not an account state; it is derived from the identity provider per request.
      enum: [active, suspended, deleted]

    AccountLocale:
      type: string
      enum: [nl, en]

    AccountRole:
      type: string
      description: The single highest server-derived role for the current request.
      enum: [unverified, user, business_member, reviewer]

    AccountCapabilities:
      type: object
      description: Server-derived capabilities. Clients must never send these; they are recomputed on every request.
      required: [isVerified, isEditor, isBusinessMember, canClaimBusiness, canPublishBusiness, canReview]
      properties:
        isVerified:
          type: boolean
          description: The identity provider reports a verified primary email for this session.
        isEditor:
          type: boolean
          description: The session carries the trusted editor or admin role claim.
        isBusinessMember:
          type: boolean
          description: The user has at least one business membership.
        canClaimBusiness:
          type: boolean
          description: Verified, active, and the business intake gate is on.
        canPublishBusiness:
          type: boolean
          description: Editor and the business publication gate is on.
        canReview:
          type: boolean
          description: Editor; self-review of the user's own businesses or claims is still refused per request.

    AccountMe:
      type: object
      description: Private account summary for the signed-in user only. Never served on public routes.
      required:
        - id
        - status
        - role
        - locale
        - onboardingCompleted
        - capabilities
        - hasResearchRegistration
        - businessMembershipCount
        - preferences
        - createdAt
      properties:
        id:
          type: number
          description: Local account id (never the identity-provider subject).
        status:
          $ref: "#/components/schemas/AccountStatus"
        role:
          $ref: "#/components/schemas/AccountRole"
        locale:
          $ref: "#/components/schemas/AccountLocale"
        onboardingCompleted:
          type: boolean
        onboardingCompletedAt:
          type: ["string", "null"]
        capabilities:
          $ref: "#/components/schemas/AccountCapabilities"
        hasResearchRegistration:
          type: boolean
          description: Whether the separate campaign-style research registration exists. Never merged into account data.
        businessMembershipCount:
          type: number
        preferences:
          oneOf:
            - $ref: "#/components/schemas/ConsumerPreferences"
            - type: "null"
        createdAt:
          type: string

    ConsumerPreferences:
      type: object
      description: Optional controlled preferences owned by exactly one account. Updates require expectedRevision and return 409 VERSION_CONFLICT on mismatch. Unresolved IDs are stored legacy choices that no longer occur in the current taxonomy; they remain in the ID arrays until the user removes them.
      required: [revision, neighborhoodIds, interestIds, unresolvedNeighborhoodIds, unresolvedInterestIds, updatedAt]
      properties:
        revision:
          type: number
        neighborhoodIds:
          type: array
          maxItems: 20
          items:
            type: string
        interestIds:
          type: array
          maxItems: 20
          items:
            type: string
        unresolvedNeighborhoodIds:
          type: array
          maxItems: 20
          items:
            type: string
          description: Subset of neighborhoodIds that no longer resolves in the current account option taxonomy.
        unresolvedInterestIds:
          type: array
          maxItems: 20
          items:
            type: string
          description: Subset of interestIds that no longer resolves in the current account option taxonomy.
        updatedAt:
          type: string

    ConsentPurpose:
      type: string
      description: |
        Purpose-specific consents that are asked separately from account creation and from
        the research registration. `marketing_updates`: occasional product and neighbourhood
        updates by e-mail. `research_contact`: may be contacted about product research.
      enum: [marketing_updates, research_contact]

    UpdateAccountPreferencesInput:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: number
          minimum: 0
          description: Current stored revision, or 0 when no preferences exist yet.
        locale:
          $ref: "#/components/schemas/AccountLocale"
        neighborhoodIds:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 120
        interestIds:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 120

    RecordAccountConsentInput:
      type: object
      additionalProperties: false
      required: [consentType, noticeVersion, granted, source]
      properties:
        consentType:
          $ref: "#/components/schemas/ConsentPurpose"
        noticeVersion:
          type: string
          maxLength: 80
        granted:
          type: boolean
        source:
          type: string
          description: Where the user made the choice; support and system entries are never accepted from clients.
          enum: [onboarding, account_settings]

    ConsentState:
      type: object
      required: [consentType, granted, noticeVersion, recordedAt]
      properties:
        consentType:
          $ref: "#/components/schemas/ConsentPurpose"
        granted:
          type: boolean
        noticeVersion:
          type: string
        recordedAt:
          type: string

    AccountConsents:
      type: object
      required: [currentNoticeVersion, purposes, current, history]
      properties:
        currentNoticeVersion:
          type: string
          description: Version of the consent notice text the client must show before recording a choice.
        purposes:
          type: array
          description: All purposes that can be asked; a purpose without a current entry has never been asked.
          items:
            $ref: "#/components/schemas/ConsentPurpose"
        current:
          type: array
          items:
            $ref: "#/components/schemas/ConsentState"
        history:
          type: array
          items:
            $ref: "#/components/schemas/ConsentEvent"

    ConsentEvent:
      type: object
      description: One append-only consent ledger entry. Entries are never edited; the latest entry per consentType is the current state.
      required: [id, consentType, noticeVersion, granted, source, createdAt]
      properties:
        id:
          type: number
        consentType:
          type: string
        noticeVersion:
          type: string
        granted:
          type: boolean
        source:
          type: string
          enum: [onboarding, account_settings, support, system]
        createdAt:
          type: string

    AccountDeletionScope:
      type: string
      description: |
        What an account deletion request covers. The research registration, community
        contributions, and Clerk credentials are separate scopes handled outside this request.
      enum: [account_profile, preferences, consents, saved_events, business_memberships]

    CreateAccountDeletionRequestInput:
      type: object
      additionalProperties: false
      required: [acknowledgedScopes]
      properties:
        acknowledgedScopes:
          type: array
          description: Must contain every AccountDeletionScope value exactly once.
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/AccountDeletionScope"

    WithdrawAccountRequestInput:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: number
          minimum: 1

    AccountRequestStatus:
      type: string
      description: |
        `received` awaits support; `blocked` needs a support decision about a sole-owned business
        first; `in_review` is being handled; `completed`, `rejected`, and `withdrawn` are final.
      enum: [received, blocked, in_review, completed, rejected, withdrawn]

    AccountRequestResolution:
      type: string
      enum: [ownership_transferred, business_closed, business_unpublished, account_deleted, request_rejected]

    AccountRequestBlockedBusiness:
      type: object
      required: [businessProfileId, name, publicationStatus, resolved]
      properties:
        businessProfileId:
          type: number
        name:
          type: string
        publicationStatus:
          type: string
        resolved:
          type: boolean
          description: True once a support resolution has been recorded for this business.

    AccountRequestBlocker:
      type: object
      required: [code, businesses]
      properties:
        code:
          type: string
          enum: [blocked_ownership]
        businesses:
          type: array
          items:
            $ref: "#/components/schemas/AccountRequestBlockedBusiness"

    AccountRequest:
      type: object
      description: Requester-facing view. Support notes and the handling reviewer are never included.
      required: [id, scope, type, status, version, acknowledgedScopes, blocker, resolutionCode, deadlineAt, createdAt, updatedAt, resolvedAt, withdrawnAt]
      properties:
        id:
          type: number
        scope:
          type: string
          enum: [account, business]
        type:
          type: string
          enum: [deletion, export, suspension_appeal]
        status:
          $ref: "#/components/schemas/AccountRequestStatus"
        version:
          type: number
        acknowledgedScopes:
          type: array
          items:
            type: string
        blocker:
          oneOf:
            - $ref: "#/components/schemas/AccountRequestBlocker"
            - type: "null"
        resolutionCode:
          type: ["string", "null"]
        deadlineAt:
          type: ["string", "null"]
          description: Null until a handling deadline is approved in release configuration.
        createdAt:
          type: string
        updatedAt:
          type: string
        resolvedAt:
          type: ["string", "null"]
        withdrawnAt:
          type: ["string", "null"]

    AccountRequests:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/AccountRequest"

    AccountRequestEvent:
      type: object
      required: [id, fromStatus, toStatus, actor, resolutionCode, businessProfileId, note, createdAt]
      properties:
        id:
          type: number
        fromStatus:
          type: ["string", "null"]
        toStatus:
          type: string
        actor:
          type: string
          enum: [requester, support, system]
        resolutionCode:
          type: ["string", "null"]
        businessProfileId:
          type: ["number", "null"]
        note:
          type: ["string", "null"]
        createdAt:
          type: string

    SupportAccountRequest:
      allOf:
        - $ref: "#/components/schemas/AccountRequest"
        - type: object
          required: [userId, resolutionNote, resolvedByUserId, events]
          properties:
            userId:
              type: number
              description: Internal app user id of the requester; never contact data.
            resolutionNote:
              type: ["string", "null"]
            resolvedByUserId:
              type: ["string", "null"]
            events:
              type: array
              items:
                $ref: "#/components/schemas/AccountRequestEvent"

    SupportAccountRequests:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/SupportAccountRequest"

    SupportAccountRequestDecisionInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, decision]
      properties:
        expectedVersion:
          type: number
          minimum: 1
        decision:
          type: string
          enum: [start_review, resolve_blocker, complete, reject]
        resolutionCode:
          $ref: "#/components/schemas/AccountRequestResolution"
        businessProfileId:
          type: number
          description: Required for `resolve_blocker`; must be one of the request's blocked businesses.
        note:
          type: string
          maxLength: 1000
          description: Internal support note; never shown to the requester.

    LifecycleMessageStatus:
      type: string
      enum: [queued, sending, accepted, delivered, failed, cancelled]

    LifecycleMessage:
      type: object
      required: [id, eventCode, status, locale, businessName, attempts, maxAttempts, nextRetryAt, acceptedAt, deliveredAt, failedAt, createdAt]
      properties:
        id:
          type: number
        eventCode:
          type: string
        status:
          $ref: "#/components/schemas/LifecycleMessageStatus"
        locale:
          type: string
        businessName:
          type: ["string", "null"]
        attempts:
          type: number
        maxAttempts:
          type: number
        nextRetryAt:
          type: ["string", "null"]
        acceptedAt:
          type: ["string", "null"]
        deliveredAt:
          type: ["string", "null"]
        failedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    LifecycleMessages:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/LifecycleMessage"

    SupportLifecycleMessage:
      allOf:
        - $ref: "#/components/schemas/LifecycleMessage"
        - type: object
          required: [recipientUserId, lastErrorCode, lastErrorAt]
          properties:
            recipientUserId:
              type: ["number", "null"]
            lastErrorCode:
              type: ["string", "null"]
            lastErrorAt:
              type: ["string", "null"]

    SupportLifecycleMessages:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/SupportLifecycleMessage"

    AccountOption:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: object
          required: [nl, en]
          properties:
            nl:
              type: string
            en:
              type: string

    AccountOptions:
      type: object
      required: [neighborhoods, interests, taxonomyVersion]
      properties:
        taxonomyVersion:
          type: string
          description: Identifier of the controlled list version; stored IDs that no longer resolve are shown as no longer available, never dropped.
        neighborhoods:
          type: array
          items:
            $ref: "#/components/schemas/AccountOption"
        interests:
          type: array
          items:
            $ref: "#/components/schemas/AccountOption"

    BusinessRevisionStatus:
      type: string
      description: |
        draft -> submitted (owner); submitted -> approved | changes_requested | rejected (reviewer);
        changes_requested -> submitted (owner, new version); approved -> superseded (later approval);
        draft -> discarded (owner). A business has at most one approved revision.
      enum: [draft, submitted, changes_requested, approved, rejected, superseded, discarded]

    BusinessRevisionSummary:
      type: object
      description: Owner- and reviewer-visible revision metadata. Draft content is never served on public routes.
      required: [id, businessProfileId, version, status, createdAt, updatedAt]
      properties:
        id:
          type: number
        businessProfileId:
          type: number
        version:
          type: number
        status:
          $ref: "#/components/schemas/BusinessRevisionStatus"
        submittedAt:
          type: ["string", "null"]
        decidedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    ReviewDecisionRecord:
      type: object
      description: Immutable audit entry for a reviewer decision. The reviewer is derived from the session and must not own the target (self-review is refused with SELF_REVIEW_FORBIDDEN).
      required: [id, targetType, targetId, targetVersion, decision, createdAt]
      properties:
        id:
          type: number
        targetType:
          type: string
          enum: [claim, revision, publication]
        targetId:
          type: number
        targetVersion:
          type: number
        decision:
          type: string
          enum: [approve, reject, request_changes, publish, unpublish, suspend]
        reasonCode:
          type: ["string", "null"]
        reason:
          type: ["string", "null"]
        createdAt:
          type: string

    BusinessRevisionText:
      type: object
      description: >-
        Stored editorial text in one language as it was approved or drafted. Null or missing values
        mean "not provided"; nothing is machine-translated or invented. No length limits apply here:
        content migrated from the older profile contract is preserved verbatim. New owner input is
        validated by `BusinessRevisionTextInput`.
      properties:
        tagline:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        openingHours:
          type: ["string", "null"]
          description: Free-text opening hours as stated by the owner; never derived.

    BusinessRevisionFacts:
      type: object
      description: >-
        Stored language-neutral facts. Migrated legacy values are preserved verbatim; new owner input
        is validated by `BusinessRevisionFactsInput`.
      properties:
        websiteUrl:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        coverUrl:
          type: ["string", "null"]

    BusinessRevisionTextInput:
      type: object
      description: Owner-supplied editorial text in one language. Omitted fields are left untouched; null clears a field.
      properties:
        tagline:
          type: ["string", "null"]
          maxLength: 160
        description:
          type: ["string", "null"]
          maxLength: 2000
        openingHours:
          type: ["string", "null"]
          maxLength: 500

    BusinessRevisionFactsInput:
      type: object
      description: Owner-supplied language-neutral facts. Only http(s) URLs are accepted.
      properties:
        websiteUrl:
          type: ["string", "null"]
          maxLength: 500
        phone:
          type: ["string", "null"]
          maxLength: 40
        email:
          type: ["string", "null"]
          maxLength: 160
          pattern: "^$|^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
        address:
          type: ["string", "null"]
          maxLength: 240
        logoUrl:
          type: ["string", "null"]
          maxLength: 500
        coverUrl:
          type: ["string", "null"]
          maxLength: 500

    BusinessRevisionContent:
      type: object
      required: [nl, en, facts]
      properties:
        nl:
          $ref: "#/components/schemas/BusinessRevisionText"
        en:
          $ref: "#/components/schemas/BusinessRevisionText"
        facts:
          $ref: "#/components/schemas/BusinessRevisionFacts"

    BusinessRevision:
      allOf:
        - $ref: "#/components/schemas/BusinessRevisionSummary"
        - type: object
          required: [content]
          properties:
            content:
              $ref: "#/components/schemas/BusinessRevisionContent"

    BusinessRevisionUpdateInput:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: number
          description: Version of the latest revision the owner saw; 0 when the business has none yet.
        nl:
          $ref: "#/components/schemas/BusinessRevisionTextInput"
        en:
          $ref: "#/components/schemas/BusinessRevisionTextInput"
        facts:
          $ref: "#/components/schemas/BusinessRevisionFactsInput"

    BusinessRevisionTransitionInput:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: number

    FactCheckStatus:
      type: string
      description: Reviewer verdict for one approved field. `contradicted` fields are withheld publicly; `unchecked` and `unavailable` are shown with that provenance.
      enum: [unchecked, confirmed, contradicted, unavailable]

    BusinessFactCheck:
      type: object
      required: [field, status, sourceUrl, checkedOn]
      properties:
        field:
          type: string
        status:
          $ref: "#/components/schemas/FactCheckStatus"
        sourceUrl:
          type: ["string", "null"]
        checkedOn:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
          description: Reviewer note; only served to owners and reviewers, never publicly.

    BusinessFactCheckInput:
      type: object
      required: [field, status]
      properties:
        field:
          type: string
          enum: [tagline, description, openingHours, websiteUrl, phone, email, address, logoUrl, coverUrl]
        status:
          $ref: "#/components/schemas/FactCheckStatus"
        sourceUrl:
          type: ["string", "null"]
          maxLength: 500
        note:
          type: ["string", "null"]
          maxLength: 500

    BusinessFreshness:
      type: object
      description: |
        Truthful freshness of the approved snapshot. `unverified` when no field was ever confirmed;
        `stale` when the newest confirmation is older than `staleAfterDays`. `recheckDue` flags a
        still-fresh snapshot that turns stale within `recheckWindowDays`, so owners and reviewers can
        schedule a re-check before it flips. `staleOn` is derived from `checkedOn`, never stored.
        Freshness is independent from publication status.
      required: [status, checkedOn, staleAfterDays, staleOn, daysUntilStale, recheckWindowDays, recheckDue]
      properties:
        status:
          type: string
          enum: [unverified, fresh, stale]
        checkedOn:
          type: ["string", "null"]
        staleAfterDays:
          type: number
        staleOn:
          type: ["string", "null"]
          description: ISO date-time when the snapshot turns (or turned) stale; null when unverified.
        daysUntilStale:
          type: ["number", "null"]
          description: Whole days until `staleOn`; negative once stale; null when unverified.
        recheckWindowDays:
          type: number
        recheckDue:
          type: boolean

